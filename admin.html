<title>Virtual Chat - Admin</title>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,
body{
    width:100%;
    height:100%;

    color:#fff;
}

button,
input{

button{
    -webkit-tap-highlight-color:transparent;
}

#app{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;

/* =====================================================
   HEADER
===================================================== */

.header{

    position:fixed;

    left:0;
    right:0;
    top:0;

    height:62px;

    background:#000;

    border-bottom:1px solid #222;

    display:flex;

    align-items:center;

    padding:0 8px;

}

.back-button{

    width:45px;
    height:48px;

    border:0;
    outline:0;

    background:transparent;

    font-size:30px;

    display:none;

}

.header-info{

    flex:1;

}

.title{

    color:#38bdf8;

    font-weight:bold;

    line-height:23px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.subtitle{

    color:#999;

    font-size:12px;

}

.header-right{

    display:flex;

    align-items:center;

    justify-content:center;

}

.logout-button{

    height:42px;

    padding:0 13px;

    border:0;

    border-radius:9px;

    background:#171717;

    border:1px solid #292929;

    color:#fff;

    font-size:14px;

}

.logout-button:active{

    background:#292929;

}

.header-menu{

    width:46px;
    height:46px;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:31px;

    display:none;

}


/* =====================================================
   USER SCREEN
===================================================== */

#userScreen{

    position:fixed;

    left:0;
    right:0;

    top:62px;
    bottom:0;

    background:#000;

    overflow:hidden;

}

.search-box{

    height:58px;

    padding:8px;

    border-bottom:1px solid #222;

}

#userSearch{

    width:100%;

    height:42px;

    border:0;
    outline:0;

    border-radius:22px;

    background:#222;

    color:#fff;

    padding:0 16px;

}

#userSearch::placeholder{

}

#userList{

    position:absolute;

    left:0;

    top:58px;

}

.user-row{

    min-height:70px;

    align-items:center;

}

.user-row:active{

}

.user-info{

}

.user-name{

    font-size:16px;

    white-space:nowrap;

    text-overflow:ellipsis;

}

.user-email{

    color:#777;

    font-size:12px;

    margin-top:4px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;

}

.user-menu-button{

    flex:0 0 45px;

    width:45px;
    height:45px;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:27px;

}

.user-menu-button:active{

    background:#222;

    border-radius:50%;

}

.empty{

    color:#777;

    text-align:center;

}

#loading{

    color:#888;

/* =====================================================
   POPUP MENU
===================================================== */

.popup{

    position:fixed;

    width:190px;

    padding:6px;

    background:#151515;

    border:1px solid #333;

    border-radius:12px;

    z-index:100000;

}

.popup.open{

}

.popup button{

    width:100%;

}


/* =====================================================
   CHAT PAGE THREE-DOT MENU
   ALWAYS ON THE RIGHT SIDE
===================================================== */

#mainMenu{

    position:fixed;

    top:68px;

    right:8px;

    left:auto;

    width:190px;

    padding:6px;

    background:#151515;

    border:1px solid #333;

    border-radius:12px;

        0 8px 30px

}

}


/* =====================================================
   DIALOG
===================================================== */

.dialog-backdrop{

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.65);

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    z-index:500000;

}

.dialog-backdrop.open{

    display:flex;

}

.dialog{

    width:100%;

    max-width:360px;

    background:#171717;

    border:1px solid #333;

    border-radius:18px;

    padding:20px;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.8);

}

.dialog-title{

    color:#fff;

    font-size:19px;

    font-weight:bold;

    margin-bottom:8px;

}

.dialog-text{

}

.dialog-label{

}

.dialog-input{

    width:100%;

    height:45px;

    border:1px solid #333;

    border-radius:10px;

    background:#0d0d0d;

    padding:0 13px;

}

.dialog-input:focus{

}

.dialog-buttons{

    display:flex;

    gap:9px;

    justify-content:flex-end;

}

.dialog-button{

    min-width:85px;

    padding:0 13px;

    border:0;

    border-radius:9px;

    font-size:14px;

}

.cancel-button{

    background:#292929;

    color:#fff;

}

.save-button{

    background:#38bdf8;

    color:#000;

    font-weight:bold;

}

.delete-button{

    background:#d93025;

    color:#fff;

    font-weight:bold;

}

.dialog-button:active{

    transform:scale(.97);

}


/* =====================================================
   CHAT SCREEN
===================================================== */

#chatScreen{

    position:fixed;

    left:0;
    right:0;

    top:62px;
    bottom:0;

    display:none;

    overflow:hidden;

    background:#000;

}

.wallpaper{

    position:absolute;

    inset:0;

    background-color:#000;

    background-position:center;

    background-size:cover;

    background-repeat:no-repeat;

    z-index:0;

}

.wallpaper-overlay{

    position:absolute;

    inset:0;

    background:rgba(0,0,0,.30);

    z-index:1;

    pointer-events:none;

}

#chatArea{

    position:absolute;

    left:0;
    right:0;
    top:0;
    bottom:0;

    z-index:2;

    overflow-y:auto;

    overflow-x:hidden;

    padding:12px;

    padding-bottom:80px;

}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    width:max-content;

    max-width:78%;

    margin-bottom:9px;

    padding:9px 12px;

    border-radius:14px;

    color:#fff;

    font-size:15px;

    line-height:1.35;

    word-break:break-word;

}

.message.sent{

    margin-left:auto;

    background:#075e54;

}

.message.received{

    background:#202020;

    border-bottom-left-radius:4px;

}

.message-time{

    margin-top:4px;

    text-align:right;

    color:#aaa;

    font-size:10px;

}

.message-link{

    color:#7dd3fc;

    text-decoration:underline;

    word-break:break-all;

}


/* =====================================================
   INPUT BAR
===================================================== */

#inputBar{

    position:fixed;

    left:0;

    width:100%;

    height:64px;

    min-height:64px;

    background:#000;

    border-top:1px solid #222;

    display:none;

    align-items:center;

    gap:7px;

    padding:8px;

    z-index:999999;

}

#messageInput{

    flex:1;

    min-width:0;

    height:44px;

    border:0;
    outline:0;

    border-radius:23px;

    background:#222;

    color:#fff;

    padding:0 16px;

    font-size:16px;

}

#messageInput::placeholder{

    color:#999;

}

#sendButton{

    flex:0 0 45px;

    width:45px;
    height:45px;

    border:0;
    outline:0;

    border-radius:50%;

    background:#38bdf8;

    color:#000;

    font-size:20px;

    font-weight:bold;

}

#sendButton:active{

    transform:scale(.94);

}


/* =====================================================
   STATUS
===================================================== */

#status{

    position:fixed;

    left:50%;

    transform:translateX(-50%);

    bottom:75px;

    padding:8px 14px;

    border-radius:20px;

    background:#111;

    color:#fff;

    display:none;

    z-index:900000;

    font-size:13px;

}


/* =====================================================
   SCROLLBAR
===================================================== */

#chatArea::-webkit-scrollbar,
#userList::-webkit-scrollbar{

    width:4px;

}

#chatArea::-webkit-scrollbar-thumb,
#userList::-webkit-scrollbar-thumb{

    background:#444;

    border-radius:10px;

}

</style>

<body>

<!-- =====================================================
     WALLPAPER FILE INPUT
===================================================== -->

<input

    accept="image/*"

<script type="module">


/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    getFirestore,
    collection,
    doc,
    getDoc,
    addDoc,
    updateDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp,
    deleteField
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIGURATION
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDCeUtuKciz8z3C0x__AEZeHv8X4Y9ClFU",

    authDomain:
    "virtualchat-1213.firebaseapp.com",

    projectId:
    "virtualchat-1213",

    storageBucket:
    "virtualchat-1213.firebasestorage.app",

    messagingSenderId:
    "10737514662",

    appId:
    "1:10737514662:web:7d418df0cf4f441d275c67",

    measurementId:
    "G-8WVST7HH7D"

};


const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const userScreen =
    document.getElementById(
        "userScreen"
    );

const chatScreen =
    document.getElementById(
        "chatScreen"
    );

const userList =
    document.getElementById(
        "userList"
    );

const userSearch =
    document.getElementById(
        "userSearch"
    );

const backButton =
    document.getElementById(
        "backButton"
    );

const headerTitle =
    document.getElementById(
        "headerTitle"
    );

const headerSubtitle =
    document.getElementById(
        "headerSubtitle"
    );

const headerMenu =
    document.getElementById(
        "headerMenu"
    );

const mainMenu =
    document.getElementById(
        "mainMenu"
    );

const userMenu =
    document.getElementById(
        "userMenu"
    );

const inputBar =
    document.getElementById(
        "inputBar"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const chatArea =
    document.getElementById(
        "chatArea"
    );

const wallpaper =
    document.getElementById(
        "wallpaper"
    );

const statusBox =
    document.getElementById(
        "status"
    );

const usernameDialog =
    document.getElementById(
        "usernameDialog"
    );

const newUsernameInput =
    document.getElementById(
        "newUsernameInput"
    );

const deleteDialog =
    document.getElementById(
        "deleteDialog"
    );


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let adminUid = null;

let selectedUser = null;

let selectedUserId = null;

let chatId = null;

let allUsers = [];

let unsubscribeUsers = null;

let unsubscribeMessages = null;


/* =====================================================
   STATUS MESSAGE
===================================================== */

function showStatus(text){

    statusBox.textContent =
        text;

    statusBox.style.display =
        "block";

    setTimeout(
        function(){

            statusBox.style.display =
                "none";

        },
        1800
    );

}


/* =====================================================
   AUTHENTICATION
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }

        currentUser =
            user;

        adminUid =
            user.uid;

        await checkAdmin();

    }
);


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(){

    try{

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const snap =
            await getDoc(
                userRef
            );


        if(
            !snap.exists()
        ){

            alert(
                "Admin profile was not found."
            );

            await signOut(auth);

            return;

        }


        const data =
            snap.data();


        if(
            data.role !== "admin"
        ){

            alert(
                "Only the Admin can use this page."
            );

            await signOut(auth);

            return;

        }


        loadUsers();

    }
    catch(error){

        console.error(
            error
        );

        alert(
            "Admin verification failed: " +
            error.message
        );

    }

}


/* =====================================================
   LOAD ALL USERS
===================================================== */

function loadUsers(){

    if(
        unsubscribeUsers
    ){

        unsubscribeUsers();

    }


    const usersRef =
        collection(
            db,
            "users"
        );


    unsubscribeUsers =
        onSnapshot(

            usersRef,

            function(snapshot){

                allUsers =
                    [];


                snapshot.forEach(
                    function(docSnap){

                        const data =
                            docSnap.data();


                        if(
                            docSnap.id ===
                            adminUid
                        ){

                            return;

                        }


                        if(
                            data.role ===
                            "admin"
                        ){

                            return;

                        }


                        allUsers.push({

                            id:
                                docSnap.id,

                            ...data

                        });

                    }
                );


                allUsers.sort(
                    function(a,b){

                        const aName =
                            (
                                a.displayUsername ||
                                a.username ||
                                a.email ||
                                "User"
                            ).toLowerCase();


                        const bName =
                            (
                                b.displayUsername ||
                                b.username ||
                                b.email ||
                                "User"
                            ).toLowerCase();


                        return aName.localeCompare(
                            bName
                        );

                    }
                );


                renderUsers();

            },

            function(error){

                console.error(
                    "Users error:",
                    error
                );


                userList.innerHTML =
                    '<div class="empty">Failed to load users.</div>';

            }

        );

}


/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers(){

    const search =
        userSearch.value
        .trim()
        .toLowerCase();


    userList.innerHTML =
        "";


    const users =
        allUsers.filter(
            function(user){

                const name =
                    (
                        user.displayUsername ||
                        user.username ||
                        ""
                    ).toLowerCase();


                const email =
                    (
                        user.email ||
                        ""
                    ).toLowerCase();


                return (
                    name.includes(search) ||
                    email.includes(search)
                );

            }
        );


    if(
        users.length === 0
    ){

        userList.innerHTML =
            '<div class="empty">No users found.</div>';

        return;

    }


    users.forEach(
        function(user){

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "user-row";


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "user-info";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "user-name";


            name.textContent =
                user.displayUsername ||
                user.username ||
                "User";


            const email =
                document.createElement(
                    "div"
                );


            email.className =
                "user-email";


            email.textContent =
                user.email ||
                "";


            info.appendChild(
                name
            );


            info.appendChild(
                email
            );


            info.onclick =
            function(){

                openUserChat(
                    user
                );

            };


            const menuButton =
                document.createElement(
                    "button"
                );


            menuButton.className =
                "user-menu-button";


            menuButton.textContent =
                "⋮";


            menuButton.onclick =
            function(event){

                event.stopPropagation();

                openUserMenu(
                    user,
                    menuButton
                );

            };


            row.appendChild(
                info
            );


            row.appendChild(
                menuButton
            );


            userList.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   SEARCH USERS
===================================================== */

userSearch.addEventListener(
    "input",
    renderUsers
);


/* =====================================================
   USER MENU
===================================================== */

function openUserMenu(
    user,
    button
){

    selectedUser =
        user;


    selectedUserId =
        user.id;


    const rect =
        button.getBoundingClientRect();


    userMenu.style.left =
        "auto";


    userMenu.style.right =
        "8px";


    let top =
        rect.bottom + 4;


    const menuHeight =
        100;


    if(
        top + menuHeight >
        window.innerHeight
    ){

        top =
            rect.top -
            menuHeight -
            4;

    }


    userMenu.style.top =
        top + "px";


    userMenu.classList.add(
        "open"
    );


    mainMenu.classList.remove(
        "open"
    );

}


/* =====================================================
   CHANGE USERNAME
===================================================== */

document.getElementById(

/* =====================================================
   WALLPAPER
===================================================== */

const wallpaperInput =
    document.getElementById(
        "wallpaperInput"
    );


function loadWallpaper(){

    const saved =
        localStorage.getItem(
            "admin_wallpaper"
        );


    if(saved){

        wallpaper.style.backgroundImage =
            'url("' +
            saved +
            '")';

    }
    else{

        wallpaper.style.backgroundImage =
            "";

    }

}

document.getElementById(
    "wallpaperButton"
).onclick =
function(){

    mainMenu.classList.remove(
        "open"
    );


    wallpaperInput.click();

};


wallpaperInput.onchange =
function(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        alert(
            "Please select an image."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
    function(){

        try{

            localStorage.setItem(
                "admin_wallpaper",
                reader.result
            );


            wallpaper.style.backgroundImage =
                'url("' +
                reader.result +
                '")';


            showStatus(
                "Wallpaper changed"
            );

        }
        catch(error){

            alert(
                "The image is too large. Please use a smaller image."
            );

        }

    };


    reader.readAsDataURL(
        file
    );


    event.target.value =
        "";

};

/* =====================================================
   LOAD MESSAGES
===================================================== */

function loadMessages(){

    if(
        !chatId
    ){

        return;

    }


    if(
        unsubscribeMessages
    ){

        unsubscribeMessages();

    }


    const ref =
        collection(
            db,
            "chats",
            chatId,
            "messages"
        );


    const q =
        query(
            ref,
            orderBy(
                "createdAt",
                "asc"
            )
        );


    unsubscribeMessages =
        onSnapshot(

            q,

            function(snapshot){

                chatArea.innerHTML =
                    "";


                snapshot.forEach(
                    function(docSnap){

                        showMessage(
                            docSnap.data()
                        );

                    }
                );


                scrollBottom();

            },

            function(error){

                console.error(
                    "Messages error:",
                    error
                );


                if(
                    error.code ===
                    "permission-denied"
                ){

                    alert(
                        "Firestore permission denied. Please check your Firestore rules."
                    );

                }

            }

        );

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const text =
        messageInput.value.trim();


    if(
        !text ||
        !currentUser ||
        !chatId
    ){

        return;

    }


    sendButton.disabled =
        true;


    try{

        await addDoc(

            collection(
                db,
                "chats",
                chatId,
                "messages"
            ),

            {

                senderId:
                    currentUser.uid,

                senderEmail:
                    currentUser.email ||
                    "",

                type:
                    "text",

                text:
                    text,

                createdAt:
                    serverTimestamp()

            }

        );


        messageInput.value =
            "";


        messageInput.focus();


        setTimeout(
            fixKeyboardBar,
            100
        );

    }
    catch(error){

        console.error(
            "Send error:",
            error
        );


        alert(
            "Message send failed:\n" +
            error.message
        );

    }


    sendButton.disabled =
        false;

}


sendButton.onclick =
    sendMessage;

   SEND WITH ENTER
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendMessage();

);


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(data){

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "message " +
        (
            data.senderId ===
            currentUser.uid

            ?

            "sent"

            :

            "received"
        );


    if(
        data.type ===
        "text"
    ){

        const textBox =
            document.createElement(
                "div"
            );


        createTextWithLinks(
            data.text || "",
            textBox
        );


        box.appendChild(
            textBox
        );

    }


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "message-time";


    time.textContent =
        getTime(
            data.createdAt
        );


    box.appendChild(
        time
    );


    chatArea.appendChild(
        box
    );

}


/* =====================================================
   LINK DETECTION
===================================================== */

function createTextWithLinks(
    text,
    container
){

    const urlRegex =
        /(https?:\/\/[^\s]+)/g;


    let lastIndex =
        0;


    let match;


    while(
        (match =
            urlRegex.exec(text))
        !== null
    ){

        const before =
            text.slice(
                lastIndex,
                match.index
            );


        if(before){

            container.appendChild(
                document.createTextNode(
                    before
                )
            );

        }


        let url =
            match[0];


        let trailing =
            "";


        while(
            /[.,!?;:)\]]$/.test(url)
        ){

            trailing =
                url.slice(-1) +
                trailing;

            url =
                url.slice(0,-1);

        }


        const link =
            document.createElement(
                "a"
            );


        link.className =
            "message-link";


        link.href =
            url;


        link.target =
            "_blank";


        link.rel =
            "noopener noreferrer";


        link.textContent =
            url;


        container.appendChild(
            link
        );


        if(trailing){

            container.appendChild(
                document.createTextNode(
                    trailing
                )
            );

        }


        lastIndex =
            match.index +
            match[0].length;

    }


    if(
        lastIndex <
        text.length
    ){

        container.appendChild(
            document.createTextNode(
                text.slice(
                    lastIndex
                )
            )
        );

    }

}


/* =====================================================
   MESSAGE TIME
===================================================== */

function getTime(timestamp){

    if(
        !timestamp
    ){

        return "";

    }


    try{

        return timestamp
            .toDate()
            .toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }
    catch(error){

        return "";

    }

}


/* =====================================================
   SCROLL TO BOTTOM
===================================================== */

function scrollBottom(){

    setTimeout(
        function(){

            chatArea.scrollTop =
                chatArea.scrollHeight;

        },
        80
    );

}


/* =====================================================
   KEYBOARD FIX
===================================================== */

function fixKeyboardBar(){

    if(
        !inputBar ||
        inputBar.style.display ===
        "none"
    ){

        return;

    }


    if(
        window.visualViewport
    ){

        const viewport =
            window.visualViewport;


        const barHeight =
            inputBar.offsetHeight;


        const top =
            viewport.offsetTop +
            viewport.height -
            barHeight;


        inputBar.style.top =
            top + "px";


        inputBar.style.bottom =
            "auto";


        const keyboardHeight =
            Math.max(
                0,

                window.innerHeight -
                viewport.height -
                viewport.offsetTop

            );


        chatArea.style.paddingBottom =
            (
                barHeight +
                keyboardHeight +
                12

            ) + "px";

    }
    else{

        inputBar.style.bottom =
            "0";

    }

}


/* =====================================================
   VISUAL VIEWPORT
===================================================== */

if(
    window.visualViewport
){

    window.visualViewport.addEventListener(
        "resize",
        fixKeyboardBar
    );


    window.visualViewport.addEventListener(
        "scroll",
        fixKeyboardBar
    );

}


/* =====================================================
   INPUT FOCUS
===================================================== */

messageInput.addEventListener(
    "focus",
    function(){

        setTimeout(
            fixKeyboardBar,
            50
        );


        setTimeout(
            fixKeyboardBar,
            200
        );


        setTimeout(
            fixKeyboardBar,
            500
        );


        setTimeout(
            scrollBottom,
            500
        );

    }
);

   WINDOW RESIZE
===================================================== */

setTimeout(
