<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>Admin Chat</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#app{
    position:fixed;
    inset:0;
    background:#000;
    overflow:hidden;
}

/* ================= HEADER ================= */

.header{
    position:fixed;
    left:0;
    right:0;
    top:0;
    height:62px;
    background:#000;
    border-bottom:1px solid #222;
    display:flex;
    align-items:center;
    z-index:5000;
    padding:0 8px;
}

.back-button{
    width:45px;
    height:48px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:30px;
    display:none;
}

.header-info{
    flex:1;
    min-width:0;
}

.title{
    color:#38bdf8;
    font-size:21px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.subtitle{
    color:#999;
    font-size:12px;
    margin-top:2px;
}

.header-menu{
    width:48px;
    height:48px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:32px;
}

/* ================= USER LIST ================= */

#userScreen{
    position:fixed;
    inset:62px 0 0 0;
    background:#000;
    overflow:hidden;
}

.search-box{
    height:58px;
    padding:8px;
    border-bottom:1px solid #222;
}

#userSearch{
    width:100%;
    height:42px;
    border:0;
    outline:0;
    border-radius:22px;
    background:#222;
    color:#fff;
    padding:0 16px;
    font-size:16px;
}

#userSearch::placeholder{
    color:#888;
}

#userList{
    position:absolute;
    left:0;
    right:0;
    top:58px;
    bottom:0;
    overflow-y:auto;
}

.user-row{
    height:70px;
    display:flex;
    align-items:center;
    padding:8px 8px 8px 14px;
    border-bottom:1px solid #222;
}

.user-row:active{
    background:#171717;
}

.user-info{
    flex:1;
    min-width:0;
}

.user-name{
    color:#fff;
    font-size:17px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-email{
    color:#888;
    font-size:12px;
    margin-top:4px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-menu-button{
    width:45px;
    height:45px;
    border:0;
    background:transparent;
    color:#fff;
    font-size:28px;
}

.empty{
    color:#777;
    text-align:center;
    padding:30px;
}

/* ================= POPUP ================= */

.popup{
    position:fixed;

    top:62px;
    right:8px;
    left:auto;

    width:190px;
    max-width:calc(100vw - 16px);

    padding:6px;

    background:#151515;

    border:1px solid #333;
    border-radius:12px;

    display:none;

    z-index:100000;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.7);
}

.popup.open{
    display:block;
}

.popup button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:8px;
    background:transparent;
    color:#fff;
    text-align:left;
    font-size:15px;
}

.popup button:active{
    background:#292929;
}

/* ================= CHAT ================= */

#chatScreen{
    position:fixed;
    left:0;
    right:0;
    top:62px;
    bottom:0;
    display:none;
    overflow:hidden;
    background:#000;
}

.wallpaper{
    position:absolute;
    inset:0;
    background-color:#000;
    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;
    z-index:0;
}

.wallpaper-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.30);
    z-index:1;
    pointer-events:none;
}

#chatArea{
    position:absolute;
    inset:0;
    z-index:2;
    overflow-y:auto;
    padding:12px;
    padding-bottom:80px;
    -webkit-overflow-scrolling:touch;
}

.message{
    width:max-content;
    max-width:78%;
    margin-bottom:9px;
    padding:9px 12px;
    border-radius:14px;
    color:#fff;
    font-size:15px;
    line-height:1.35;
    word-break:break-word;
}

.message.sent{
    margin-left:auto;
    background:#075e54;
    border-bottom-right-radius:4px;
}

.message.received{
    margin-right:auto;
    background:#202020;
    border-bottom-left-radius:4px;
}

.message-time{
    margin-top:4px;
    text-align:right;
    color:#aaa;
    font-size:10px;
}

/* ================= INPUT ================= */

#inputBar{
    position:fixed;
    left:0;
    width:100%;
    height:64px;
    min-height:64px;
    background:#000;
    border-top:1px solid #222;
    display:none;
    align-items:center;
    gap:7px;
    padding:8px;
    z-index:999999;
}

#attachButton{
    flex:0 0 43px;
    width:43px;
    height:43px;
    border:0;
    border-radius:50%;
    background:#222;
    color:#fff;
    font-size:21px;
}

#messageInput{
    flex:1;
    min-width:0;
    height:44px;
    border:0;
    outline:0;
    border-radius:23px;
    background:#222;
    color:#fff;
    padding:0 16px;
    font-size:16px;
}

#messageInput::placeholder{
    color:#999;
}

#sendButton{
    flex:0 0 45px;
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#38bdf8;
    color:#000;
    font-size:20px;
    font-weight:bold;
}

/* ================= ATTACH ================= */

#attachMenu{
    position:fixed;
    left:8px;
    width:190px;
    padding:6px;
    background:#111;
    border:1px solid #333;
    border-radius:12px;
    display:none;
    z-index:1000000;
}

#attachMenu.open{
    display:block;
}

.attach-item{
    width:100%;
    padding:13px;
    margin:2px 0;
    border:0;
    border-radius:8px;
    background:#222;
    color:#fff;
    text-align:left;
    font-size:15px;
}

.preview-image{
    max-width:240px;
    max-height:280px;
    border-radius:10px;
}

.preview-video{
    width:240px;
    max-height:280px;
    border-radius:10px;
}

.file-box{
    color:#fff;
}

/* ================= STATUS ================= */

#status{
    position:fixed;
    left:50%;
    transform:translateX(-50%);
    bottom:75px;
    padding:8px 14px;
    border-radius:20px;
    background:#111;
    color:#fff;
    display:none;
    z-index:2000000;
}

/* ================= LOADING ================= */

#loading{
    color:#888;
    text-align:center;
    padding:30px;
}

</style>

</head>

<body>

<div id="app">

<!-- ================= HEADER ================= -->

<div class="header">

    <button
        id="backButton"
        class="back-button">
        ←
    </button>

    <div class="header-info">

        <div
            id="headerTitle"
            class="title">
            Users
        </div>

        <div
            id="headerSubtitle"
            class="subtitle">
            Admin
        </div>

    </div>

    <button
        id="headerMenu"
        class="header-menu">
        ⋮
    </button>

</div>


<!-- ================= USER SCREEN ================= -->

<div id="userScreen">

    <div class="search-box">

        <input
            id="userSearch"
            type="text"
            placeholder="Search users"
            autocomplete="off">

    </div>

    <div id="userList">

        <div id="loading">
            Loading users...
        </div>

    </div>

</div>


<!-- ================= CHAT SCREEN ================= -->

<div id="chatScreen">

    <div
        id="wallpaper"
        class="wallpaper">
    </div>

    <div
        class="wallpaper-overlay">
    </div>

    <div
        id="chatArea">
    </div>

</div>


<!-- ================= HEADER MENU ================= -->

<div
    id="mainMenu"
    class="popup">

    <button id="wallpaperButton">
        Wallpaper
    </button>

    <button id="logoutButton">
        Logout
    </button>

</div>


<!-- ================= USER MENU ================= -->

<div
    id="userMenu"
    class="popup">

    <button id="changeUsernameButton">
        Change Username
    </button>

    <button id="deleteNameButton">
        Delete Name
    </button>

</div>


<!-- ================= ATTACH MENU ================= -->

<div id="attachMenu">

    <button
        id="photoButton"
        class="attach-item">
        🖼️ Photo
    </button>

    <button
        id="videoButton"
        class="attach-item">
        🎥 Video
    </button>

    <button
        id="fileButton"
        class="attach-item">
        📄 File
    </button>

</div>


<!-- ================= INPUT ================= -->

<div id="inputBar">

    <button id="attachButton">
        📎
    </button>

    <input
        id="messageInput"
        type="text"
        placeholder="Message"
        autocomplete="off"
        enterkeyhint="send">

    <button id="sendButton">
        ➤
    </button>

</div>


<div id="status">
    Please wait...
</div>

</div>


<!-- ================= FILE INPUTS ================= -->

<input
    id="wallpaperInput"
    type="file"
    accept="image/*"
    hidden>

<input
    id="photoInput"
    type="file"
    accept="image/*"
    hidden>

<input
    id="videoInput"
    type="file"
    accept="video/*"
    hidden>

<input
    id="fileInput"
    type="file"
    hidden>


<script type="module">

/* =====================================================
   FIREBASE
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    doc,
    getDoc,
    getDocs,
    addDoc,
    updateDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp,
    deleteField
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDCeUtuKciz8z3C0x__AEZeHv8X4Y9ClFU",

    authDomain:
    "virtualchat-1213.firebaseapp.com",

    projectId:
    "virtualchat-1213",

    storageBucket:
    "virtualchat-1213.firebasestorage.app",

    messagingSenderId:
    "10737514662",

    appId:
    "1:10737514662:web:7d418df0cf4f441d275c67",

    measurementId:
    "G-8WVST7HH7D"

};


const app =
    initializeApp(
        firebaseConfig
    );

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* =====================================================
   ELEMENTS
===================================================== */

const userScreen =
    document.getElementById(
        "userScreen"
    );

const chatScreen =
    document.getElementById(
        "chatScreen"
    );

const userList =
    document.getElementById(
        "userList"
    );

const userSearch =
    document.getElementById(
        "userSearch"
    );

const backButton =
    document.getElementById(
        "backButton"
    );

const headerTitle =
    document.getElementById(
        "headerTitle"
    );

const headerSubtitle =
    document.getElementById(
        "headerSubtitle"
    );

const headerMenu =
    document.getElementById(
        "headerMenu"
    );

const mainMenu =
    document.getElementById(
        "mainMenu"
    );

const userMenu =
    document.getElementById(
        "userMenu"
    );

const inputBar =
    document.getElementById(
        "inputBar"
    );

const messageInput =
    document.getElementById(
        "messageInput"
    );

const sendButton =
    document.getElementById(
        "sendButton"
    );

const attachButton =
    document.getElementById(
        "attachButton"
    );

const attachMenu =
    document.getElementById(
        "attachMenu"
    );

const chatArea =
    document.getElementById(
        "chatArea"
    );

const wallpaper =
    document.getElementById(
        "wallpaper"
    );


/* =====================================================
   VARIABLES
===================================================== */

let currentUser = null;

let selectedUser = null;

let selectedUserId = null;

let adminUid = null;

let chatId = null;

let allUsers = [];

let unsubscribeUsers = null;

let unsubscribeMessages = null;


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }

        currentUser =
            user;

        adminUid =
            user.uid;

        await checkAdmin();

    }
);


/* =====================================================
   CHECK ADMIN
===================================================== */

async function checkAdmin(){

    try{

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );

        const snap =
            await getDoc(
                userRef
            );

        if(
            !snap.exists()
        ){

            alert(
                "Admin profile পাওয়া যায়নি।"
            );

            await signOut(auth);

            return;

        }

        const data =
            snap.data();

        if(
            data.role !== "admin"
        ){

            alert(
                "এই page শুধু Admin ব্যবহার করতে পারবে।"
            );

            await signOut(auth);

            return;

        }

        loadUsers();

    }
    catch(error){

        console.error(
            error
        );

        alert(
            "Admin verification failed."
        );

    }

}


/* =====================================================
   LOAD USERS
===================================================== */

function loadUsers(){

    const usersRef =
        collection(
            db,
            "users"
        );


    const q =
        query(
            usersRef,
            where(
                "role",
                "!=",
                "admin"
            )
        );


    if(
        unsubscribeUsers
    ){

        unsubscribeUsers();

    }


    unsubscribeUsers =
        onSnapshot(

            q,

            function(snapshot){

                allUsers =
                    [];


                snapshot.forEach(
                    function(docSnap){

                        const data =
                            docSnap.data();


                        allUsers.push({

                            id:
                                docSnap.id,

                            ...data

                        });

                    }
                );


                renderUsers();

            },

            function(error){

                console.error(
                    "Users error:",
                    error
                );

                userList.innerHTML =
                    '<div class="empty">Users load failed.</div>';

            }

        );

}


/* =====================================================
   RENDER USERS
===================================================== */

function renderUsers(){

    const search =
        userSearch.value
        .trim()
        .toLowerCase();


    userList.innerHTML =
        "";


    let users =
        allUsers.filter(
            function(user){

                const name =
                    (
                        user.displayUsername ||
                        user.username ||
                        ""
                    ).toLowerCase();

                const email =
                    (
                        user.email ||
                        ""
                    ).toLowerCase();


                return (
                    name.includes(search) ||
                    email.includes(search)
                );

            }
        );


    if(
        users.length === 0
    ){

        userList.innerHTML =
            '<div class="empty">No users found.</div>';

        return;

    }


    users.forEach(
        function(user){

            const row =
                document.createElement(
                    "div"
                );


            row.className =
                "user-row";


            const info =
                document.createElement(
                    "div"
                );


            info.className =
                "user-info";


            const name =
                document.createElement(
                    "div"
                );


            name.className =
                "user-name";


            name.textContent =
                user.displayUsername ||
                user.username ||
                "User";


            const email =
                document.createElement(
                    "div"
                );


            email.className =
                "user-email";


            email.textContent =
                user.email ||
                "";


            info.appendChild(
                name
            );

            info.appendChild(
                email
            );


            info.onclick =
            function(){

                openUserChat(
                    user
                );

            };


            const menuButton =
                document.createElement(
                    "button"
                );


            menuButton.className =
                "user-menu-button";

            menuButton.textContent =
                "⋮";


            menuButton.onclick =
            function(event){

                event.stopPropagation();

                openUserMenu(
                    user,
                    menuButton
                );

            };


            row.appendChild(
                info
            );

            row.appendChild(
                menuButton
            );


            userList.appendChild(
                row
            );

        }
    );

}


/* =====================================================
   SEARCH
===================================================== */

userSearch.addEventListener(
    "input",
    function(){

        renderUsers();

    }
);


/* =====================================================
   USER MENU
===================================================== */

function openUserMenu(
    user,
    button
){

    selectedUser =
        user;

    selectedUserId =
        user.id;


    const rect =
        button.getBoundingClientRect();


    userMenu.style.right =
        "8px";


    userMenu.style.left =
        "auto";


    userMenu.style.top =
        (
            rect.bottom + 4
        ) + "px";


    userMenu.classList.add(
        "open"
    );


    mainMenu.classList.remove(
        "open"
    );

}


/* =====================================================
   CHANGE USERNAME
===================================================== */

document.getElementById(
    "changeUsernameButton"
).onclick =
async function(){

    userMenu.classList.remove(
        "open"
    );


    if(
        !selectedUserId
    ){

        return;

    }


    const oldName =
        selectedUser.displayUsername ||
        selectedUser.username ||
        "User";


    const newName =
        prompt(
            "New display username:",
            oldName
        );


    if(
        newName === null
    ){

        return;

    }


    const cleanName =
        newName.trim();


    if(
        !cleanName
    ){

        alert(
            "Username empty রাখা যাবে না।"
        );

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "users",
                selectedUserId
            ),

            {

                displayUsername:
                    cleanName

            }

        );


        alert(
            "Username changed."
        );

    }
    catch(error){

        console.error(
            error
        );

        alert(
            "Username change failed: " +
            error.message
        );

    }

};


/* =====================================================
   DELETE DISPLAY NAME
===================================================== */

document.getElementById(
    "deleteNameButton"
).onclick =
async function(){

    userMenu.classList.remove(
        "open"
    );


    if(
        !selectedUserId
    ){

        return;

    }


    const confirmDelete =
        confirm(
            "এই user-এর display name list থেকে remove করতে চাও?"
        );


    if(
        !confirmDelete
    ){

        return;

    }


    try{

        await updateDoc(

            doc(
                db,
                "users",
                selectedUserId
            ),

            {

                displayUsername:
                    deleteField()

            }

        );


        alert(
            "Display name removed."
        );

    }
    catch(error){

        console.error(
            error
        );

        alert(
            "Name delete failed: " +
            error.message
        );

    }

};


/* =====================================================
   OPEN USER CHAT
===================================================== */

function openUserChat(user){

    selectedUser =
        user;

    selectedUserId =
        user.id;


    /*
     * Admin + User
     * exactly same chat ID.
     */

    chatId =
        [
            adminUid,
            selectedUserId
        ]
        .sort()
        .join("_");


    headerTitle.textContent =
        user.displayUsername ||
        user.username ||
        "User";


    headerSubtitle.textContent =
        "Admin";


    userScreen.style.display =
        "none";


    chatScreen.style.display =
        "block";


    inputBar.style.display =
        "flex";


    backButton.style.display =
        "block";


    loadChatWallpaper();

    loadMessages();

    setTimeout(
        fixKeyboardBar,
        100
    );

}


/* =====================================================
   BACK
===================================================== */

backButton.onclick =
function(){

    if(
        unsubscribeMessages
    ){

        unsubscribeMessages();

        unsubscribeMessages =
            null;

    }


    selectedUser =
        null;

    selectedUserId =
        null;

    chatId =
        null;


    chatArea.innerHTML =
        "";


    chatScreen.style.display =
        "none";


    inputBar.style.display =
        "none";


    userScreen.style.display =
        "block";


    backButton.style.display =
        "none";


    headerTitle.textContent =
        "Users";


    headerSubtitle.textContent =
        "Admin";


    loadWallpaper();

};


/* =====================================================
   HEADER MENU
===================================================== */

headerMenu.onclick =
function(event){

    event.stopPropagation();

    mainMenu.classList.toggle(
        "open"
    );

    userMenu.classList.remove(
        "open"
    );

};


/* =====================================================
   WALLPAPER
===================================================== */

const wallpaperInput =
    document.getElementById(
        "wallpaperInput"
    );


function loadWallpaper(){

    const saved =
        localStorage.getItem(
            "admin_wallpaper"
        );


    if(saved){

        document.getElementById(
            "wallpaper"
        ).style.backgroundImage =
            'url("' + saved + '")';

    }

}


function loadChatWallpaper(){

    loadWallpaper();

}


loadWallpaper();


document.getElementById(
    "wallpaperButton"
).onclick =
function(){

    mainMenu.classList.remove(
        "open"
    );

    wallpaperInput.click();

};


wallpaperInput.onchange =
function(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        alert(
            "Please select an image."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
    function(){

        try{

            localStorage.setItem(
                "admin_wallpaper",
                reader.result
            );


            wallpaper.style.backgroundImage =
                'url("' +
                reader.result +
                '")';

        }
        catch(error){

            alert(
                "Image is too large."
            );

        }

    };


    reader.readAsDataURL(
        file
    );


    event.target.value =
        "";

};


/* =====================================================
   LOGOUT
===================================================== */

document.getElementById(
    "logoutButton"
).onclick =
async function(){

    try{

        await signOut(
            auth
        );

        window.location.href =
            "index.html";

    }
    catch(error){

        console.error(
            error
        );

        alert(
            "Logout failed."
        );

    }

};


/* =====================================================
   CLOSE POPUPS
===================================================== */

document.addEventListener(
    "click",
    function(event){

        if(
            !mainMenu.contains(
                event.target
            ) &&
            event.target !== headerMenu
        ){

            mainMenu.classList.remove(
                "open"
            );

        }


        if(
            !userMenu.contains(
                event.target
            ) &&
            !event.target.classList.contains(
                "user-menu-button"
            )
        ){

            userMenu.classList.remove(
                "open"
            );

        }


        if(
            !attachMenu.contains(
                event.target
            ) &&
            event.target !== attachButton
        ){

            attachMenu.classList.remove(
                "open"
            );

        }

    }
);


/* =====================================================
   LOAD MESSAGES
===================================================== */

function loadMessages(){

    if(
        !chatId
    ){

        return;

    }


    if(
        unsubscribeMessages
    ){

        unsubscribeMessages();

    }


    const ref =
        collection(
            db,
            "chats",
            chatId,
            "messages"
        );


    const q =
        query(
            ref,
            orderBy(
                "createdAt",
                "asc"
            )
        );


    unsubscribeMessages =
        onSnapshot(

            q,

            function(snapshot){

                chatArea.innerHTML =
                    "";


                snapshot.forEach(
                    function(docSnap){

                        showMessage(
                            docSnap.data()
                        );

                    }
                );


                scrollBottom();

            },

            function(error){

                console.error(
                    "Messages error:",
                    error
                );


                if(
                    error.code ===
                    "permission-denied"
                ){

                    alert(
                        "Firestore permission denied. Rules check করো।"
                    );

                }

            }

        );

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const text =
        messageInput.value.trim();


    if(
        !text ||
        !currentUser ||
        !chatId
    ){

        return;

    }


    sendButton.disabled =
        true;


    try{

        await addDoc(

            collection(
                db,
                "chats",
                chatId,
                "messages"
            ),

            {

                senderId:
                    currentUser.uid,

                senderEmail:
                    currentUser.email || "",

                type:
                    "text",

                text:
                    text,

                createdAt:
                    serverTimestamp()

            }

        );


        messageInput.value =
            "";


        messageInput.focus();


        setTimeout(
            fixKeyboardBar,
            100
        );

    }
    catch(error){

        console.error(
            "Send error:",
            error
        );


        alert(
            "Message send failed: " +
            error.message
        );

    }


    sendButton.disabled =
        false;

}


/* =====================================================
   SEND
===================================================== */

sendButton.onclick =
    sendMessage;


messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(data){

    const box =
        document.createElement(
            "div"
        );


    box.className =
        "message " +
        (
            data.senderId ===
            currentUser.uid

            ?

            "sent"

            :

            "received"
        );


    if(
        data.type ===
        "text"
    ){

        const text =
            document.createElement(
                "div"
            );


        text.textContent =
            data.text || "";


        box.appendChild(
            text
        );

    }


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "message-time";


    time.textContent =
        getTime(
            data.createdAt
        );


    box.appendChild(
        time
    );


    chatArea.appendChild(
        box
    );

}


/* =====================================================
   TIME
===================================================== */

function getTime(timestamp){

    if(
        !timestamp
    ){

        return "";

    }


    try{

        return timestamp
            .toDate()
            .toLocaleTimeString(
                [],
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

    }
    catch(error){

        return "";

    }

}


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

    setTimeout(
        function(){

            chatArea.scrollTop =
                chatArea.scrollHeight;

        },
        80
    );

}


/* =====================================================
   ATTACH
===================================================== */

attachButton.onclick =
function(event){

    event.stopPropagation();

    attachMenu.classList.toggle(
        "open"
    );

    mainMenu.classList.remove(
        "open"
    );

    positionAttachMenu();

};


function positionAttachMenu(){

    const bar =
        inputBar.getBoundingClientRect();


    attachMenu.style.left =
        "8px";


    attachMenu.style.top =
        (
            bar.top -
            attachMenu.offsetHeight -
            8
        ) + "px";

}


/* =====================================================
   LOCAL FILES
===================================================== */

document.getElementById(
    "photoButton"
).onclick =
function(){

    attachMenu.classList.remove(
        "open"
    );

    document.getElementById(
        "photoInput"
    ).click();

};


document.getElementById(
    "videoButton"
).onclick =
function(){

    attachMenu.classList.remove(
        "open"
    );

    document.getElementById(
        "videoInput"
    ).click();

};


document.getElementById(
    "fileButton"
).onclick =
function(){

    attachMenu.classList.remove(
        "open"
    );

    document.getElementById(
        "fileInput"
    ).click();

};


document.getElementById(
    "photoInput"
).onchange =
function(event){

    const file =
        event.target.files[0];

    if(file){

        showLocalFile(
            file,
            "photo"
        );

    }

    event.target.value =
        "";

};


document.getElementById(
    "videoInput"
).onchange =
function(event){

    const file =
        event.target.files[0];

    if(file){

        showLocalFile(
            file,
            "video"
        );

    }

    event.target.value =
        "";

};


document.getElementById(
    "fileInput"
).onchange =
function(event){

    const file =
        event.target.files[0];

    if(file){

        showLocalFile(
            file,
            "file"
        );

    }

    event.target.value =
        "";

};


function showLocalFile(
    file,
    type
){

    const url =
        URL.createObjectURL(
            file
        );


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "message sent";


    if(
        type === "photo"
    ){

        const image =
            document.createElement(
                "img"
            );


        image.src =
            url;


        image.className =
            "preview-image";


        box.appendChild(
            image
        );

    }

    else if(
        type === "video"
    ){

        const video =
            document.createElement(
                "video"
            );


        video.src =
            url;


        video.controls =
            true;


        video.className =
            "preview-video";


        box.appendChild(
            video
        );

    }

    else{

        const fileBox =
            document.createElement(
                "div"
            );


        fileBox.className =
            "file-box";


        fileBox.textContent =
            "📄 " +
            file.name;


        box.appendChild(
            fileBox
        );

    }


    const time =
        document.createElement(
            "div"
        );


    time.className =
        "message-time";


    time.textContent =
        "Local";


    box.appendChild(
        time
    );


    chatArea.appendChild(
        box
    );


    scrollBottom();

}


/* =====================================================
   KEYBOARD
===================================================== */

function fixKeyboardBar(){

    if(
        !inputBar ||
        inputBar.style.display ===
        "none"
    ){

        return;

    }


    if(
        window.visualViewport
    ){

        const viewport =
            window.visualViewport;


        const barHeight =
            inputBar.offsetHeight;


        const top =
            viewport.offsetTop +
            viewport.height -
            barHeight;


        inputBar.style.top =
            top + "px";


        inputBar.style.bottom =
            "auto";


        const keyboardHeight =
            Math.max(
                0,
                window.innerHeight -
                viewport.height -
                viewport.offsetTop
            );


        chatArea.style.paddingBottom =
            (
                barHeight +
                keyboardHeight +
                12
            ) + "px";


        if(
            attachMenu.classList.contains(
                "open"
            )
        ){

            positionAttachMenu();

        }

    }

}


/* =====================================================
   VIEWPORT
===================================================== */

if(
    window.visualViewport
){

    window.visualViewport.addEventListener(
        "resize",
        fixKeyboardBar
    );

    window.visualViewport.addEventListener(
        "scroll",
        fixKeyboardBar
    );

}


messageInput.addEventListener(
    "focus",
    function(){

        setTimeout(
            fixKeyboardBar,
            50
        );

        setTimeout(
            fixKeyboardBar,
            200
        );

        setTimeout(
            scrollBottom,
            400
        );

    }
);


window.addEventListener(
    "resize",
    function(){

        setTimeout(
            fixKeyboardBar,
            50
        );

    }
);

</script>
