<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif
}

html,body{
  width:100%;
  height:100%;
}

body{
  background:#050505;
  color:#fff;
  overflow:hidden;
}

.app{
  width:100%;
  height:100vh;
  display:flex;
  background:#050505;
}

.sidebar{
  width:350px;

  background:#0c0c0c;
  border-right:1px solid #252525;
  display:flex;

  flex-shrink:0;
}

.top-header{
  height:70px;

  align-items:center;
  padding:0 14px;
  border-bottom:1px solid #242424;
  flex-shrink:0;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  flex:1;
}

.brand-logo,
.welcome-logo,
.chat-logo{
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#00bfff,#006cff);
  color:#fff;
  font-weight:bold;
  box-shadow:0 7px 20px rgba(0,119,255,.25);
}

.brand-logo{
  width:42px;
  height:42px;
  border-radius:13px;
  font-size:17px;
}

.brand-name{
  font-size:18px;
  font-weight:bold;
  color:#fff;
}

.brand-subtitle{
  font-size:10px;
  color:#666;
  margin-top:3px;
}

.top-menu-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#171717;
  color:#aaa;
  font-size:23px;

}

.top-menu-btn:hover{

.search-area{

.avatar{

.main{

.welcome-area{

.welcome-title{

.overlay{

.side-menu{

.menu-item{

.menu-item:hover{

function showToast(text){

  toast.textContent=text;

  toast.classList.add("show");

  setTimeout(
    ()=>{
      toast.classList.remove("show");
    },
    1800
  );

}


function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


function getUsername(data){

  return (
    data.username ||
    data.Username ||
    "User"
  );

}


function getRole(data){

  return String(
    data.role ||
    data.Role ||
    ""
  )
  .toLowerCase()
  .trim();

}


function getAvatar(name){

  return name
    ? name.charAt(0).toUpperCase()
    : "U";

}


function getMessageTime(timestamp){

  if(
    !timestamp ||
    !timestamp.toDate
  ){
    return "";
  }


  return timestamp
    .toDate()
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}
// =====================================
// LOAD USERS
// =====================================

async function loadUsers(){

  userList.innerHTML = `
    <div class="empty-box">
      <div class="empty-title">Loading users...</div>
      <div class="empty-text">Please wait</div>
    </div>
  `;

  try{

    const snapshot =
      await getDocs(
        collection(db,"users")
      );

    const users = [];

    snapshot.forEach(userDoc => {

      const data =
        userDoc.data();

      if(getRole(data) !== "user"){
        return;
      }

      users.push({

        documentId:userDoc.id,

        uid:data.uid || userDoc.id,

        username:getUsername(data)

      });

    });

    allUsers = users;

    renderUsers(allUsers);

  }

  catch(error){

    console.error(error);

    userList.innerHTML = `
      <div class="empty-box">
        <div class="empty-title">
          Could not load users
        </div>

        <div class="empty-text">
          ${escapeHTML(error.message)}
        </div>
      </div>
    `;

  }

}


// =====================================
// RENDER USERS
// =====================================

function renderUsers(users){

  userList.innerHTML = "";

  if(!users.length){

    userList.innerHTML = `
      <div class="empty-box">

        <div class="empty-title">
          No users found
        </div>

        <div class="empty-text">
          No user account is available.
        </div>

      </div>
    `;

    return;
  }


  users.forEach(user => {

    const card =
      document.createElement("div");

    card.className =
      "user-card";


    card.innerHTML = `

      <div class="avatar">
        ${escapeHTML(
          getAvatar(user.username)
        )}
      </div>

      <div class="user-info">

        <div class="username">
          ${escapeHTML(user.username)}
        </div>

      </div>

      <button
        class="user-menu-btn"
        type="button"
      >
        ⋮
      </button>

    `;


    card.querySelector(
      ".user-info"
    ).onclick = () => {

      openChat(user);

    };


    card.querySelector(
      ".user-menu-btn"
    ).onclick = event => {

      event.stopPropagation();

      selectedUser = user;

      openUserPopup(
        event.currentTarget
      );

    };


    userList.appendChild(card);

  });

}


// =====================================
// SEARCH USERS
// =====================================

searchInput.oninput = () => {

  const text =
    searchInput.value
      .trim()
      .toLowerCase();


  if(!text){

    renderUsers(allUsers);

    return;

  }


  const filtered =
    allUsers.filter(user =>

      user.username
        .toLowerCase()
        .includes(text)

    );


  renderUsers(filtered);

};


// =====================================
// USER POPUP
// =====================================

function openUserPopup(button){

  userPopup.classList.add(
    "show"
  );


  const rect =
    button.getBoundingClientRect();


  let left =
    rect.right - 185;


  let top =
    rect.bottom + 5;


  if(left < 8){
    left = 8;
  }


  if(
    left + 185 >
    window.innerWidth - 8
  ){

    left =
      window.innerWidth - 193;

  }


  if(
    top + 100 >
    window.innerHeight
  ){

    top =
      rect.top - 105;

  }


  userPopup.style.left =
    left + "px";


  userPopup.style.top =
    top + "px";

}


function closeUserPopup(){

  userPopup.classList.remove(
    "show"
  );

}


// =====================================
// CHANGE USERNAME
// =====================================

changeUsernameBtn.onclick = () => {

  closeUserPopup();


  if(!selectedUser){
    return;
  }


  newUsername.value =
    selectedUser.username;


  usernameModal.classList.add(
    "show"
  );


  setTimeout(() => {

    newUsername.focus();

    newUsername.select();

  },100);

};


// =====================================
// CANCEL USERNAME
// =====================================

cancelUsername.onclick = () => {

  usernameModal.classList.remove(
    "show"
  );

  selectedUser = null;

};


// =====================================
// SAVE USERNAME
// =====================================

saveUsername.onclick =
  async () => {

    if(!selectedUser){
      return;
    }


    const name =
      newUsername.value.trim();


    if(name.length < 3){

      showToast(
        "Username must be at least 3 characters"
      );

      return;

    }


    const exists =
      allUsers.some(user =>

        user.documentId !==
        selectedUser.documentId &&

        user.username
          .toLowerCase() ===
        name.toLowerCase()

      );


    if(exists){

      showToast(
        "Username already exists"
      );

      return;

    }


    try{

      saveUsername.disabled = true;


      await updateDoc(

        doc(
          db,
          "users",
          selectedUser.documentId
        ),

        {

          username:name,

          Username:name

        }

      );


      const index =
        allUsers.findIndex(user =>

          user.documentId ===
          selectedUser.documentId

        );


      if(index !== -1){

        allUsers[index].username =
          name;

      }


      if(
        selectedChatUser &&

        selectedChatUser.documentId ===
        selectedUser.documentId
      ){

        selectedChatUser.username =
          name;


        chatUsername.textContent =
          name;


        chatLogo.textContent =
          getAvatar(name);

      }


      renderUsers(allUsers);


      usernameModal.classList.remove(
        "show"
      );


      selectedUser = null;


      showToast(
        "Username changed"
      );

    }

    catch(error){

      console.error(error);

      showToast(
        "Could not change username"
      );

    }

    finally{

      saveUsername.disabled = false;

    }

  };


// =====================================
// DELETE FROM ADMIN LIST ONLY
// =====================================

deleteUserBtn.onclick = () => {

  closeUserPopup();


  if(!selectedUser){
    return;
  }


  /*
   * IMPORTANT:
   *
   * This does NOT delete the Firebase
   * Authentication account.
   *
   * This does NOT delete the Firestore
   * user document.
   *
   * It only removes the user from the
   * current Admin page list.
   */


  allUsers =
    allUsers.filter(user =>

      user.documentId !==
      selectedUser.documentId

    );


  renderUsers(allUsers);


  selectedUser = null;


  showToast(
    "User removed from list"
  );

};


// =====================================
// OPEN CHAT
// =====================================

function openChat(user){

  selectedChatUser =
    user;


  chatUsername.textContent =
    user.username;


  chatLogo.textContent =
    getAvatar(user.username);


  chatPage.classList.add(
    "show"
  );


  chatMenu.classList.remove(
    "show"
  );


  chatInput.value = "";


  loadMessages(user);


  setTimeout(() => {

    chatInput.focus();

  },150);

}


// =====================================
// BACK FROM CHAT
// =====================================

chatBack.onclick = () => {

  chatPage.classList.remove(
    "show"
  );


  chatMenu.classList.remove(
    "show"
  );


  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages = null;

  }


  selectedChatUser = null;

};
// =====================================
// CHAT MENU
// =====================================

chatMenuBtn.onclick = event => {

  event.stopPropagation();

  chatMenu.classList.toggle("show");

};


// =====================================
// WALLPAPER
// =====================================

wallpaperBtn.onclick = () => {

  chatMenu.classList.remove("show");

  wallpaperInput.click();

};


wallpaperInput.onchange = event => {

  const file =
    event.target.files[0];

  if(!file){
    return;
  }

  const reader =
    new FileReader();

  reader.onload = e => {

    const image =
      e.target.result;

    chatBody.style.backgroundImage =
      `url("${image}")`;

    try{

      localStorage.setItem(
        "virtualchat_admin_wallpaper",
        image
      );

    }

    catch(error){

      console.error(error);

    }

  };

  reader.readAsDataURL(file);

};


// =====================================
// LOAD SAVED WALLPAPER
// =====================================

try{

  const savedWallpaper =
    localStorage.getItem(
      "virtualchat_admin_wallpaper"
    );

  if(savedWallpaper){

    chatBody.style.backgroundImage =
      `url("${savedWallpaper}")`;

  }

}

catch(error){

  console.error(error);

}


// =====================================
// LOAD MESSAGES
// =====================================

function loadMessages(user){

  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages = null;

  }


  chatBody.innerHTML = `
    <div class="empty-messages">
      Loading messages...
    </div>
  `;


  const currentUid =
    user.uid;


  const q = query(

    collection(db,"messages"),

    where(
      "participants",
      "array-contains",
      currentUid
    )

  );


  unsubscribeMessages =
    onSnapshot(

      q,

      snapshot => {

        const messages = [];


        snapshot.forEach(item => {

          const data =
            item.data();


          if(

            (
              data.senderId === currentUid ||

              data.receiverId === currentUid

            )

          ){

            messages.push({

              id:item.id,

              ...data

            });

          }

        });


        messages.sort((a,b) => {

          const aTime =
            a.createdAt?.toMillis
            ? a.createdAt.toMillis()
            : 0;


          const bTime =
            b.createdAt?.toMillis
            ? b.createdAt.toMillis()
            : 0;


          return aTime - bTime;

        });


        renderMessages(messages);

      },

      error => {

        console.error(error);


        chatBody.innerHTML = `
          <div class="empty-messages">
            Could not load messages.<br><br>
            ${escapeHTML(error.message)}
          </div>
        `;

      }

    );

}


// =====================================
// RENDER CHAT MESSAGES
// =====================================

function renderMessages(messages){

  chatBody.innerHTML = "";


  if(!messages.length){

    chatBody.innerHTML = `
      <div class="empty-messages">
        No messages yet.
      </div>
    `;

    return;

  }


  messages.forEach(data => {

    const mine =
      data.senderId === auth.currentUser?.uid;


    const row =
      document.createElement("div");


    row.className =
      mine
      ? "message-row admin"
      : "message-row user";


    const bubble =
      document.createElement("div");


    bubble.className =
      "message-bubble";


    bubble.innerHTML = `

      ${escapeHTML(data.text || "")}

      <span class="message-time">

        ${escapeHTML(
          getMessageTime(
            data.createdAt
          )
        )}

      </span>

    `;


    row.appendChild(bubble);

    chatBody.appendChild(row);

  });


  requestAnimationFrame(() => {

    chatBody.scrollTop =
      chatBody.scrollHeight;

  });

}


// =====================================
// SEND ADMIN MESSAGE
// =====================================

async function sendAdminMessage(){

  if(!selectedChatUser){

    showToast(
      "Select a user first"
    );

    return;

  }


  const text =
    chatInput.value.trim();


  if(!text){
    return;
  }


  const admin =
    auth.currentUser;


  if(!admin){

    showToast(
      "Admin is not logged in"
    );

    return;

  }


  try{

    chatSend.disabled = true;


    await addDoc(

      collection(db,"messages"),

      {

        senderId:
          admin.uid,

        receiverId:
          selectedChatUser.uid,

        text:
          text,

        participants:[
          admin.uid,
          selectedChatUser.uid
        ],

        createdAt:
          serverTimestamp()

      }

    );


    chatInput.value = "";

    chatInput.focus();

  }

  catch(error){

    console.error(error);


    showToast(
      "Message could not be sent"
    );

  }

  finally{

    chatSend.disabled = false;

  }

}


chatSend.onclick =
  sendAdminMessage;


chatInput.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      sendAdminMessage();

    }

  }
);


// =====================================
// CLOSE POPUPS
// =====================================

document.addEventListener(

);

  );

  );

};


function closeSideMenu(){

// USERNAME MODAL OUTSIDE CLICK
// =====================================

usernameModal.onclick =
  event => {

    if(
      event.target ===
      usernameModal
    ){

      usernameModal.classList.remove(
        "show"
      );

      selectedUser = null;

    }

  };


// =====================================
// ENTER TO SAVE USERNAME
// =====================================

newUsername.addEventListener(
  "keydown",
  event => {

    if(event.key === "Enter"){

      event.preventDefault();

      saveUsername.click();

    }

    if(event.key === "Escape"){

      usernameModal.classList.remove(
        "show"
      );

      selectedUser = null;

    }

  }

// =====================================
// AUTH CHECK
// =====================================

onAuthStateChanged(
  auth,
  async user => {

    if(!user){

      window.location.replace(
        "index.html"
      );

      return;

    }


    try{

      const adminQuery =
        query(

          collection(db,"users"),

          where(
            "uid",
            "==",
            user.uid
          )

        );


      const adminSnapshot =
        await getDocs(
          adminQuery
        );


      let isAdmin = false;


      adminSnapshot.forEach(
        adminDoc => {

          const data =
            adminDoc.data();


          const role =
            getRole(data);


          if(role === "admin"){

            isAdmin = true;

          }

        }
      );


      /*
       * যদি Firebase Auth user-এর
       * Firestore document-এ role না থাকে,
       * তাহলে ADMIN_EMAIL দিয়ে fallback
       * check করা হবে।
       */

      if(
        !isAdmin &&
        user.email ===
        "mdhacker8772@gmail.com"
      ){

        isAdmin = true;

      }


      if(!isAdmin){

        await signOut(auth);

        window.location.replace(
          "index.html"
        );

        return;

      }


      await loadUsers();

    }

    catch(error){

      console.error(error);


      userList.innerHTML = `
        <div class="empty-box">

          <div class="empty-title">
            Access Error
          </div>

          <div class="empty-text">
            ${escapeHTML(
              error.message
            )}
          </div>

        </div>
      `;

    }

  }
);


// =====================================
// PAGE CLEANUP
// =====================================

window.addEventListener(
  "beforeunload",
  () => {

    if(unsubscribeMessages){

      unsubscribeMessages();

      unsubscribeMessages = null;

    }

  }
);

</script>
