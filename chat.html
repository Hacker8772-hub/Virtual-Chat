<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no,
viewport-fit=cover">

<title>Virtual Chat</title>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}


/* =========================
   APP
========================= */

#app{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}


/* =========================
   HEADER
========================= */

.header{

    position:fixed;

    left:0;
    right:0;
    top:0;

    height:62px;

    background:#000;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 8px 0 18px;

    border-bottom:
        1px solid #222;

    z-index:5000;
}


.title{

    color:#38bdf8;

    font-size:22px;

    font-weight:bold;
}


.more-button{

    width:48px;
    height:48px;

    border:0;
    outline:0;

    background:transparent;

    color:#fff;

    font-size:34px;

    line-height:48px;

}


/* =========================
   THREE DOT MENU
========================= */

.menu{

    position:fixed;

    top:58px;
    right:8px;

    width:190px;

    padding:6px;

    background:#151515;

    border:
        1px solid #333;

    border-radius:12px;

    display:none;

    z-index:10000;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.7);
}


.menu.open{
    display:block;
}


.menu-item{

    width:100%;

    padding:14px;

    border:0;

    border-radius:8px;

    background:transparent;

    color:#fff;

    text-align:left;

    font-size:16px;
}


.menu-item:active{
    background:#292929;
}


/* =========================
   WALLPAPER
========================= */

.wallpaper{

    position:fixed;

    left:0;
    right:0;

    top:62px;
    bottom:0;

    background-color:#000;

    background-position:center;

    background-size:cover;

    background-repeat:no-repeat;

    z-index:0;
}


.wallpaper-overlay{

    position:fixed;

    left:0;
    right:0;

    top:62px;
    bottom:0;

    background:
        rgba(0,0,0,.30);

    z-index:1;

    pointer-events:none;
}


/* =========================
   CHAT AREA
========================= */

#chatArea{

    position:fixed;

    left:0;
    right:0;

    top:62px;

    bottom:64px;

    padding:12px;

    overflow-y:auto;

    overflow-x:hidden;

    z-index:2;

    -webkit-overflow-scrolling:touch;

    padding-bottom:12px;
}


#chatArea::-webkit-scrollbar{
    width:4px;
}


#chatArea::-webkit-scrollbar-thumb{

    background:#444;

    border-radius:10px;
}


/* =========================
   MESSAGE
========================= */

.message{

    width:max-content;

    max-width:82%;

    margin-bottom:9px;

    padding:
        9px 12px;

    border-radius:14px;

    color:#fff;

    font-size:15px;

    line-height:1.35;

    word-break:break-word;

}


.message.sent{

    margin-left:auto;

    background:#075e54;

    border-bottom-right-radius:4px;
}


.message.received{

    margin-right:auto;

    background:#202020;

    border-bottom-left-radius:4px;
}


/* =========================
   LINK MESSAGE
========================= */

.message-link{

    color:#7dd3fc;

    text-decoration:underline;

    word-break:break-all;

}


.message-link:active{
    opacity:.7;
}


/* =========================
   TIME
========================= */

.message-time{

    margin-top:4px;

    text-align:right;

    color:#aaa;

    font-size:10px;
}


/* =========================
   INPUT BAR
========================= */

#inputBar{

    position:fixed;

    left:0;

    width:100%;

    height:64px;

    min-height:64px;

    background:#000;

    border-top:
        1px solid #222;

    display:flex;

    align-items:center;

    gap:7px;

    padding:8px;

    z-index:999999;
}


/* =========================
   MESSAGE INPUT
========================= */

#messageInput{

    flex:1;

    min-width:0;

    height:44px;

    border:0;

    outline:0;

    border-radius:23px;

    background:#222;

    color:#fff;

    padding:
        0 16px;

    font-size:16px;
}


#messageInput::placeholder{
    color:#999;
}


/* =========================
   SEND BUTTON
========================= */

#sendButton{

    flex:0 0 45px;

    width:45px;

    height:45px;

    border:0;

    outline:0;

    border-radius:50%;

    background:#38bdf8;

    color:#000;

    font-size:20px;

    font-weight:bold;
}


#sendButton:active{
    transform:scale(.94);
}


#sendButton:disabled{

    opacity:.5;

}


/* =========================
   STATUS
========================= */

#status{

    position:fixed;

    left:50%;

    transform:
        translateX(-50%);

    top:70px;

    padding:
        8px 14px;

    border-radius:20px;

    background:#111;

    color:#fff;

    display:none;

    z-index:2000000;

    white-space:nowrap;
}


/* =========================
   EMPTY MESSAGE
========================= */

.empty{

    width:100%;

    text-align:center;

    color:#888;

    font-size:14px;

    margin-top:30px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:500px){

    .message{
        max-width:85%;
    }

}

</style>

</head>


<body>


<div id="app">


    <!-- =====================
         WALLPAPER
    ====================== -->

    <div
        id="wallpaper"
        class="wallpaper">
    </div>


    <div
        class="wallpaper-overlay">
    </div>


    <!-- =====================
         HEADER
    ====================== -->

    <div class="header">

        <div class="title">
            Virtual Chat
        </div>


        <button
            id="moreButton"
            class="more-button">

            ⋮

        </button>

    </div>


    <!-- =====================
         THREE DOT MENU
    ====================== -->

    <div
        id="mainMenu"
        class="menu">

        <button
            id="wallpaperButton"
            class="menu-item">

            Wallpaper

        </button>


        <button
            id="logoutButton"
            class="menu-item">

            Logout

        </button>

    </div>


    <!-- =====================
         CHAT
    ====================== -->

    <div
        id="chatArea">

        <div class="empty">
            Loading messages...
        </div>

    </div>


    <!-- =====================
         INPUT BAR
    ====================== -->

    <div
        id="inputBar">


        <input
            id="messageInput"
            type="text"
            placeholder="Message"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="sentences"
            spellcheck="false"
            enterkeyhint="send"
        >


        <button
            id="sendButton">

            ➤

        </button>


    </div>


    <!-- =====================
         STATUS
    ====================== -->

    <div id="status">
        Connecting...
    </div>


</div>


<!-- =========================
     WALLPAPER INPUT
========================= -->

<input
    id="wallpaperInput"
    type="file"
    accept="image/*"
    hidden
>


<!-- =========================
     FIREBASE
========================= -->

<script type="module">


/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


import {
    getFirestore,
    doc,
    getDoc,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyDCeUtuKciz8z3C0x__AEZeHv8X4Y9ClFU",

    authDomain:
    "virtualchat-1213.firebaseapp.com",

    projectId:
    "virtualchat-1213",

    storageBucket:
    "virtualchat-1213.firebasestorage.app",

    messagingSenderId:
    "10737514662",

    appId:
    "1:10737514662:web:7d418df0cf4f441d275c67",

    measurementId:
    "G-8WVST7HH7D"

};


/* =====================================================
   INITIALIZE FIREBASE
===================================================== */

const app =
    initializeApp(
        firebaseConfig
    );


const auth =
    getAuth(app);


const db =
    getFirestore(app);


/* =====================================================
   ADMIN UID
===================================================== */

const ADMIN_UID =
    "8oqayrMhrzPuehixzANIsuq4Tux1";


/* =====================================================
   ELEMENTS
===================================================== */

const chatArea =
    document.getElementById(
        "chatArea"
    );


const messageInput =
    document.getElementById(
        "messageInput"
    );


const sendButton =
    document.getElementById(
        "sendButton"
    );


const inputBar =
    document.getElementById(
        "inputBar"
    );


const mainMenu =
    document.getElementById(
        "mainMenu"
    );


const moreButton =
    document.getElementById(
        "moreButton"
    );


const wallpaper =
    document.getElementById(
        "wallpaper"
    );


const wallpaperInput =
    document.getElementById(
        "wallpaperInput"
    );


let currentUser =
    null;


let unsubscribeMessages =
    null;


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    text
){

    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        text;


    status.style.display =
        "block";


    clearTimeout(
        showStatus.timer
    );


    showStatus.timer =
        setTimeout(
            function(){

                status.style.display =
                    "none";

            },
            2500
        );

}


/* =====================================================
   WALLPAPER
===================================================== */

function loadWallpaper(){

    const saved =
        localStorage.getItem(
            "virtual_chat_wallpaper"
        );


    if(saved){

        wallpaper.style.backgroundImage =
            'url("' +
            saved +
            '")';

    }

}


loadWallpaper();


/* =====================================================
   WALLPAPER BUTTON
===================================================== */

document.getElementById(
    "wallpaperButton"
).onclick =
function(){

    mainMenu.classList.remove(
        "open"
    );


    wallpaperInput.click();

};


/* =====================================================
   WALLPAPER CHANGE
===================================================== */

wallpaperInput.onchange =
function(event){

    const file =
        event.target.files[0];


    if(!file){
        return;
    }


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        alert(
            "Please select an image."
        );

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
    function(){

        try{

            localStorage.setItem(
                "virtual_chat_wallpaper",
                reader.result
            );


            wallpaper.style.backgroundImage =
                'url("' +
                reader.result +
                '")';

        }
        catch(error){

            alert(
                "Image is too large."
            );

        }

    };


    reader.readAsDataURL(
        file
    );


    event.target.value =
        "";

};


/* =====================================================
   MENU
===================================================== */

moreButton.onclick =
function(event){

    event.stopPropagation();


    mainMenu.classList.toggle(
        "open"
    );

};


/* =====================================================
   CLOSE MENU
===================================================== */

document.addEventListener(
    "click",
    function(event){

        if(
            !mainMenu.contains(
                event.target
            ) &&
            event.target !== moreButton
        ){

            mainMenu.classList.remove(
                "open"
            );

        }

    }
);


/* =====================================================
   LOGOUT
===================================================== */

document.getElementById(
    "logoutButton"
).onclick =
async function(){

    try{

        await signOut(
            auth
        );


        window.location.href =
            "index.html";

    }
    catch(error){

        console.error(
            error
        );


        showStatus(
            "Logout failed"
        );

    }

};


/* =====================================================
   GET CHAT ID
===================================================== */

/*
   IMPORTANT:

   প্রতিটি user-এর জন্য
   নিজের UID দিয়ে আলাদা chat হবে।

   Example:

   chats/
      USER_UID/
          messages/
*/

function getChatId(){

    if(!currentUser){
        return null;
    }


    return currentUser.uid;

}


/* =====================================================
   GET CHAT COLLECTION
===================================================== */

function getMessagesCollection(){

    const chatId =
        getChatId();


    return collection(
        db,
        "chats",
        chatId,
        "messages"
    );

}


/* =====================================================
   LINK DETECTION
===================================================== */

function isURL(text){

    const pattern =
        /^(https?:\/\/|www\.)\S+$/i;


    return pattern.test(
        text.trim()
    );

}


/* =====================================================
   NORMALIZE URL
===================================================== */

function normalizeURL(
    text
){

    let url =
        text.trim();


    if(
        url.startsWith(
            "www."
        )
    ){

        url =
            "https://" +
            url;

    }


    return url;

}


/* =====================================================
   CREATE MESSAGE TEXT
===================================================== */

function createMessageContent(
    text
){

    const wrapper =
        document.createElement(
            "div"
        );


    const trimmed =
        (text || "").trim();


    /*
       যদি পুরো message একটি link হয়
       তাহলে clickable link হবে।
    */

    if(
        isURL(
            trimmed
        )
    ){

        const link =
            document.createElement(
                "a"
            );


        link.href =
            normalizeURL(
                trimmed
            );


        link.target =
            "_blank";


        link.rel =
            "noopener noreferrer";


        link.className =
            "message-link";


        link.textContent =
            trimmed;


        wrapper.appendChild(
            link
        );


        return wrapper;

    }


    /*
       সাধারণ text
    */

    wrapper.textContent =
        text || "";


    return wrapper;

}


/* =====================================================
   TIME
===================================================== */

function getTime(
    timestamp
){

    if(!timestamp){
        return "";
    }


    try{

        return timestamp
            .toDate()
            .toLocaleTimeString(
                [],
                {
                    hour:
                        "2-digit",

                    minute:
                        "2-digit"
                }
            );

    }
    catch(error){

        return "";

    }

}


/* =====================================================
   SHOW MESSAGE
===================================================== */

function showMessage(
    data
){

    if(!currentUser){
        return;
    }


    const mine =
        data.senderId ===
        currentUser.uid;


    const box =
        document.createElement(
            "div"
        );


    box.className =
        "message " +
        (
            mine
            ?
            "sent"
            :
            "received"
        );


    /*
       Message text
    */

    const content =
        createMessageContent(
            data.text || ""
        );


    box.appendChild(
        content
    );


    /*
       Time
    */

    const time =
        document.createElement(
            "div"
        );


    time.className =
        "message-time";


    time.textContent =
        getTime(
            data.createdAt
        );


    box.appendChild(
        time
    );


    chatArea.appendChild(
        box
    );

}


/* =====================================================
   SCROLL
===================================================== */

function scrollBottom(){

    setTimeout(
        function(){

            chatArea.scrollTop =
                chatArea.scrollHeight;

        },
        50
    );

}


/* =====================================================
   LOAD REALTIME MESSAGES
===================================================== */

function loadMessages(){

    if(
        unsubscribeMessages
    ){

        unsubscribeMessages();

        unsubscribeMessages =
            null;

    }


    if(!currentUser){
        return;
    }


    const messagesRef =
        getMessagesCollection();


    const messagesQuery =
        query(
            messagesRef,

            orderBy(
                "createdAt",
                "asc"
            )
        );


    unsubscribeMessages =
        onSnapshot(

            messagesQuery,

            function(snapshot){

                chatArea.innerHTML =
                    "";


                if(
                    snapshot.empty
                ){

                    const empty =
                        document.createElement(
                            "div"
                        );


                    empty.className =
                        "empty";


                    empty.textContent =
                        "Start a conversation with Admin";


                    chatArea.appendChild(
                        empty
                    );


                    return;

                }


                snapshot.forEach(
                    function(docSnap){

                        const data =
                            docSnap.data();


                        showMessage(
                            data
                        );

                    }
                );


                scrollBottom();

            },

            function(error){

                console.error(
                    "Firestore realtime error:",
                    error
                );


                showStatus(
                    "Messages could not be loaded"
                );

            }

        );

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

    const text =
        messageInput.value.trim();


    if(
        !text
    ){

        return;

    }


    if(
        !currentUser
    ){

        showStatus(
            "Please login first"
        );

        return;

    }


    sendButton.disabled =
        true;


    try{

        await addDoc(

            getMessagesCollection(),

            {

                senderId:
                    currentUser.uid,

                receiverId:
                    ADMIN_UID,

                text:
                    text,

                type:
                    "text",

                createdAt:
                    serverTimestamp()

            }

        );


        messageInput.value =
            "";


        messageInput.focus();


        scrollBottom();

    }
    catch(error){

        console.error(
            "Send message error:",
            error
        );


        console.error(
            "Firebase error code:",
            error.code
        );


        showStatus(
            "Message send failed"
        );

    }


    sendButton.disabled =
        false;

}


/* =====================================================
   SEND BUTTON
===================================================== */

sendButton.onclick =
    sendMessage;


/* =====================================================
   ENTER TO SEND
===================================================== */

messageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();


            sendMessage();

        }

    }
);


/* =====================================================
   KEYBOARD BAR FIX
===================================================== */

function fixKeyboardBar(){

    if(
        !window.visualViewport
    ){

        inputBar.style.bottom =
            "0";

        inputBar.style.top =
            "auto";

        return;

    }


    const viewport =
        window.visualViewport;


    const barHeight =
        inputBar.offsetHeight;


    const topPosition =
        viewport.offsetTop +
        viewport.height -
        barHeight;


    inputBar.style.top =
        topPosition + "px";


    inputBar.style.bottom =
        "auto";


    /*
       Chat area keyboard-এর নিচে
       যেন message না ঢাকে।
    */

    const keyboardHeight =
        Math.max(
            0,

            window.innerHeight -
            viewport.height -
            viewport.offsetTop
        );


    chatArea.style.paddingBottom =
        (
            keyboardHeight +
            12
        ) + "px";


    if(
        document.activeElement ===
        messageInput
    ){

        scrollBottom();

    }

}


/* =====================================================
   VISUAL VIEWPORT
===================================================== */

if(
    window.visualViewport
){

    window.visualViewport.addEventListener(
        "resize",
        function(){

            fixKeyboardBar();

        }
    );


    window.visualViewport.addEventListener(
        "scroll",
        function(){

            fixKeyboardBar();

        }
    );

}


/* =====================================================
   INPUT FOCUS
===================================================== */

messageInput.addEventListener(
    "focus",
    function(){

        setTimeout(
            fixKeyboardBar,
            50
        );


        setTimeout(
            fixKeyboardBar,
            200
        );


        setTimeout(
            fixKeyboardBar,
            500
        );


        setTimeout(
            scrollBottom,
            500
        );

    }
);


/* =====================================================
   INPUT BLUR
===================================================== */

messageInput.addEventListener(
    "blur",
    function(){

        setTimeout(
            fixKeyboardBar,
            100
        );

    }
);


/* =====================================================
   WINDOW RESIZE
===================================================== */

window.addEventListener(
    "resize",
    function(){

        setTimeout(
            fixKeyboardBar,
            50
        );

    }
);


/* =====================================================
   AUTH
===================================================== */

onAuthStateChanged(

    auth,

    async function(user){

        if(!user){

            window.location.href =
                "index.html";

            return;

        }


        currentUser =
            user;


        /*
           User profile থাকলে
           admin যেন user-কে চিনতে পারে।
        */

        try{

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );


            const userSnap =
                await getDoc(
                    userRef
                );


            if(
                !userSnap.exists()
            ){

                console.warn(
                    "User profile not found."
                );

            }

        }
        catch(error){

            console.error(
                "User profile error:",
                error
            );

        }


        loadMessages();


        setTimeout(
            fixKeyboardBar,
            100
        );


        setTimeout(
            fixKeyboardBar,
            500
        );

    }

);


/* =====================================================
   INITIAL KEYBOARD POSITION
===================================================== */

setTimeout(
    fixKeyboardBar,
    100
);


setTimeout(
    fixKeyboardBar,
    500
);


</script>

</body>

</html>
