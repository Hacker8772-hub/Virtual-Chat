<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>VirtualChat</title>

<style>

/* ==============================
   RESET
============================== */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
}


/* ==============================
   BODY
============================== */

body{
  width:100%;
  height:100dvh;
  min-height:100dvh;

  background:#000;
  color:#fff;

  display:flex;
  flex-direction:column;

  overflow:hidden;

  position:relative;
}


/* ==============================
   HEADER
============================== */

.header{
  height:68px;
  min-height:68px;

  background:#0d0d0d;

  border-bottom:1px solid #292929;

  display:flex;
  align-items:center;

  padding:0 12px;

  flex-shrink:0;
}


.logo{
  width:42px;
  height:42px;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #00bfff,
      #006cff
    );

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:19px;
  font-weight:bold;

  margin-right:10px;
}


.headText{
  flex:1;
  min-width:0;
}


.title{
  font-size:18px;
  font-weight:bold;
  color:#fff;
}


.subtitle{
  font-size:11px;
  color:#777;
  margin-top:4px;
}


.menu{
  width:44px;
  height:44px;

  border:0;
  border-radius:13px;

  background:#181818;
  color:#aaa;

  font-size:26px;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;

  flex-shrink:0;
}


/* ==============================
   CHAT AREA
============================== */

.chat{
  flex:1;
  min-height:0;

  width:100%;

  overflow-y:auto;
  overflow-x:hidden;

  padding:10px 12px 12px;

  background:#080808;

  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;

  -webkit-overflow-scrolling:touch;
}


.chat::-webkit-scrollbar{
  width:4px;
}


.chat::-webkit-scrollbar-thumb{
  background:#333;
  border-radius:10px;
}


/* ==============================
   MESSAGE ROW
============================== */

.row{
  width:100%;

  display:flex;

  margin:2px 0;
}


.row.me{
  justify-content:flex-end;
}


.row.other{
  justify-content:flex-start;
}


/* ==============================
   MESSAGE BUBBLE
============================== */

.bubble{
  position:relative;

  display:block;

  width:fit-content;

  max-width:min(78%,420px);

  min-width:0;

  padding:6px 8px 5px;

  border-radius:8px;

  font-size:15px;

  line-height:1.32;

  word-break:break-word;

  overflow-wrap:anywhere;

  white-space:pre-wrap;
}


/* ==============================
   USER MESSAGE
============================== */

.me .bubble{
  background:
    linear-gradient(
      135deg,
      #008cff,
      #0061d8
    );

  color:#fff;

  border-radius:
    8px 8px 2px 8px;
}


/* ==============================
   ADMIN MESSAGE
============================== */

.other .bubble{
  background:#181818;

  color:#eee;

  border:1px solid #292929;

  border-radius:
    8px 8px 8px 2px;
}


/* ==============================
   MESSAGE TEXT
============================== */

.messageText{
  display:inline;

  font-size:15px;

  line-height:1.35;
}


/* ==============================
   CLICKABLE LINKS
============================== */

.messageLink{
  color:#73cfff;

  text-decoration:underline;

  text-decoration-thickness:1px;

  text-underline-offset:2px;

  cursor:pointer;

  word-break:break-all;

  overflow-wrap:anywhere;
}


.me .messageLink{
  color:#fff;
}


/* ==============================
   TIME
============================== */

.time{
  display:inline-block;

  margin-left:8px;

  font-size:9px;

  line-height:10px;

  color:rgba(255,255,255,.58);

  white-space:nowrap;

  vertical-align:bottom;
}


/* ==============================
   EMPTY MESSAGE
============================== */

.empty{
  width:100%;
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  text-align:center;

  color:#666;

  font-size:13px;
}


/* ==============================
   BOTTOM BAR
============================== */

.bottom{
  width:100%;

  height:70px;
  min-height:70px;
  max-height:70px;

  flex-shrink:0;

  background:#0d0d0d;

  border-top:1px solid #292929;

  display:flex;
  align-items:center;

  gap:8px;

  padding:9px 10px;

  position:relative;

  z-index:20;
}


.input{
  flex:1;
  min-width:0;

  height:48px;

  border-radius:15px;

  border:1px solid #292929;

  outline:none;

  background:#181818;

  color:#fff;

  padding:0 14px;

  font-size:15px;
}


.input::placeholder{
  color:#777;
}


.input:focus{
  border-color:#008cff;
}


.send{
  width:50px;
  height:48px;

  border:0;

  border-radius:15px;

  background:
    linear-gradient(
      135deg,
      #00bfff,
      #006cff
    );

  color:#fff;

  font-size:21px;

  flex-shrink:0;

  cursor:pointer;
}


.send:disabled{
  opacity:.55;
}


/* ==============================
   POPUP MENU
============================== */

.popup{
  position:fixed;

  right:12px;
  top:76px;

  width:180px;

  background:#181818;

  border:1px solid #303030;

  border-radius:14px;

  padding:6px;

  display:none;

  z-index:100;

  box-shadow:
    0 18px 45px rgba(0,0,0,.8);
}


.popup.show{
  display:block;
}


.popup button{
  width:100%;
  height:44px;

  border:0;

  border-radius:9px;

  background:transparent;

  color:#ddd;

  text-align:left;

  padding:0 13px;

  font-size:13px;

  cursor:pointer;
}


.popup button:active{
  background:#252525;
}


#wallpaperInput{
  display:none;
}


/* ==============================
   MOBILE
============================== */

@media(max-width:500px){

  body{
    height:100dvh;
    min-height:100dvh;
  }

  .header{
    height:68px;
    min-height:68px;
    flex-shrink:0;
  }

  .chat{
    flex:1;
    min-height:0;

    padding:
      10px
      12px
      12px;
  }

  .bottom{
    height:68px;
    min-height:68px;
    max-height:68px;

    flex-shrink:0;

    padding:
      8px
      10px
      8px;
  }

  .input{
    height:48px;
    min-width:0;

    font-size:15px;
  }

  .send{
    width:48px;
    height:48px;

    flex-shrink:0;
  }

  .bubble{
    max-width:78%;
    font-size:15px;
  }

  .messageText{
    font-size:15px;
  }

}

</style>

</head>


<body>


<!-- ==============================
     HEADER
============================== -->

<div class="header">

  <div class="logo">
    V
  </div>

  <div class="headText">

    <div class="title">
      VirtualChat
    </div>

    <div class="subtitle">
      Online
    </div>

  </div>

  <button
    class="menu"
    id="menuBtn"
    type="button"
  >
    ⋮
  </button>

</div>


<!-- ==============================
     CHAT
============================== -->

<div
  class="chat"
  id="chat"
>

  <div class="empty">
    Loading messages...
  </div>

</div>


<!-- ==============================
     BOTTOM
============================== -->

<div class="bottom">

  <input
    class="input"
    id="messageInput"
    type="text"
    placeholder="Type a message..."
    autocomplete="off"
  >

  <button
    class="send"
    id="sendBtn"
    type="button"
  >
    ➤
  </button>

</div>


<!-- ==============================
     POPUP
============================== -->

<div
  class="popup"
  id="popup"
>

  <button
    id="wallpaperBtn"
    type="button"
  >
    Wallpaper
  </button>

  <button
    id="logoutBtn"
    type="button"
  >
    Logout
  </button>

</div>


<input
  id="wallpaperInput"
  type="file"
  accept="image/*"
>


<script type="module">


/* ==========================================
   FIREBASE IMPORTS
========================================== */

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged,
  signOut
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  where,
  onSnapshot,
  addDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* ==========================================
   FIREBASE CONFIG
========================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDCeUtuKciz8z3C0x__AEZeHv8X4Y9ClFU",

  authDomain:
    "virtualchat-1213.firebaseapp.com",

  projectId:
    "virtualchat-1213",

  storageBucket:
    "virtualchat-1213.firebasestorage.app",

  messagingSenderId:
    "10737514662",

  appId:
    "1:10737514662:web:7d418df0cf4f441d275c67",

  measurementId:
    "G-8WVST7HH7D"

};


/* ==========================================
   INITIALIZE FIREBASE
========================================== */

const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ==========================================
   ELEMENTS
========================================== */

const chat =
  document.getElementById("chat");

const input =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const menuBtn =
  document.getElementById("menuBtn");

const popup =
  document.getElementById("popup");

const wallpaperBtn =
  document.getElementById("wallpaperBtn");

const wallpaperInput =
  document.getElementById("wallpaperInput");

const logoutBtn =
  document.getElementById("logoutBtn");


/* ==========================================
   VARIABLES
========================================== */

let currentUser = null;

let adminUid = null;

let stopMessages = null;

let stopAdmin = null;


/* ==========================================
   HTML ESCAPE
========================================== */

function escapeHTML(value){

  return String(value)

    .replaceAll("&","&amp;")

    .replaceAll("<","&lt;")

    .replaceAll(">","&gt;")

    .replaceAll('"',"&quot;")

    .replaceAll("'","&#039;");

}


/* ==========================================
   CREATE MESSAGE CONTENT
========================================== */

function createMessageContent(text){

  const fragment =
    document.createDocumentFragment();


  const urlRegex =
    /(https?:\/\/[^\s]+|www\.[^\s]+)/gi;


  let lastIndex = 0;

  const matches =
    [...String(text).matchAll(urlRegex)];


  matches.forEach(match => {

    const url =
      match[0];

    const index =
      match.index;


    if(index > lastIndex){

      const normalText =
        String(text)
          .slice(lastIndex,index);


      fragment.appendChild(
        document.createTextNode(
          normalText
        )
      );

    }


    const link =
      document.createElement("a");


    link.className =
      "messageLink";


    link.textContent =
      url;


    let targetURL =
      url;


    if(
      targetURL
        .toLowerCase()
        .startsWith("www.")
    ){

      targetURL =
        "https://" + targetURL;

    }


    link.href =
      targetURL;


    link.target =
      "_blank";


    link.rel =
      "noopener noreferrer";


    link.addEventListener(
      "click",
      event => {

        event.stopPropagation();

      }
    );


    fragment.appendChild(link);


    lastIndex =
      index + url.length;

  });


  if(
    lastIndex <
    String(text).length
  ){

    fragment.appendChild(

      document.createTextNode(

        String(text)
          .slice(lastIndex)

      )

    );

  }


  return fragment;

}


/* ==========================================
   MESSAGE TIME
========================================== */

function getMessageTime(timestamp){

  if(
    !timestamp ||
    !timestamp.toDate
  ){

    return "";

  }


  return timestamp
    .toDate()
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* ==========================================
   SHOW MESSAGES
========================================== */

function showMessages(docs){

  const messages = [];


  docs.forEach(item => {

    const data =
      item.data();


    if(
      typeof data.text === "string"
    ){

      messages.push({

        id:item.id,

        ...data

      });

    }

  });


  messages.sort((a,b) => {

    const aTime =
      a.createdAt &&
      a.createdAt.toMillis
        ? a.createdAt.toMillis()
        : 0;


    const bTime =
      b.createdAt &&
      b.createdAt.toMillis
        ? b.createdAt.toMillis()
        : 0;


    return aTime - bTime;

  });


  chat.innerHTML = "";


  if(messages.length === 0){

    chat.innerHTML = `

      <div class="empty">
        No messages yet.
      </div>

    `;

    return;

  }


  messages.forEach(data => {

    const mine =
      data.senderId === currentUser.uid;


    const row =
      document.createElement("div");


    row.className =
      mine
        ? "row me"
        : "row other";


    const bubble =
      document.createElement("div");


    bubble.className =
      "bubble";


    const messageContent =
      createMessageContent(
        data.text
      );


    bubble.appendChild(
      messageContent
    );


    const time =
      document.createElement("span");


    time.className =
      "time";


    time.textContent =
      getMessageTime(
        data.createdAt
      );


    bubble.appendChild(
      time
    );


    row.appendChild(
      bubble
    );


    chat.appendChild(
      row
    );

  });


  requestAnimationFrame(() => {

    chat.scrollTop =
      chat.scrollHeight;

  });

}


/* ==========================================
   FIND ADMIN
========================================== */

function findAdmin(){

  if(stopAdmin){

    stopAdmin();

    stopAdmin = null;

  }


  const adminQuery =
    query(

      collection(db,"users"),

      where(
        "role",
        "==",
        "admin"
      )

    );


  stopAdmin =
    onSnapshot(

      adminQuery,


      snapshot => {

        if(snapshot.empty){

          adminUid = null;


          chat.innerHTML = `

            <div class="empty">
              Admin account not found.
            </div>

          `;


          return;

        }


        const adminDoc =
          snapshot.docs[0];


        const adminData =
          adminDoc.data();


        adminUid =
          adminData.uid ||
          adminDoc.id;


        listenMessages();

      },


      error => {

        console.error(
          "Admin error:",
          error
        );


        chat.innerHTML = `

          <div class="empty">
            Could not load admin.
          </div>

        `;

      }

    );

}
/* ==========================================
   LISTEN TO MESSAGES
========================================== */

function listenMessages(){

  if(
    !currentUser ||
    !adminUid
  ){

    return;

  }


  if(stopMessages){

    stopMessages();

    stopMessages = null;

  }


  const messageQuery =
    query(

      collection(db,"messages"),

      where(
        "participants",
        "array-contains",
        currentUser.uid
      )

    );


  stopMessages =
    onSnapshot(

      messageQuery,


      snapshot => {

        const docs =
          snapshot.docs.filter(item => {

            const data =
              item.data();


            const currentUserInMessage =

              data.senderId === currentUser.uid ||

              data.receiverId === currentUser.uid;


            const adminInMessage =

              data.senderId === adminUid ||

              data.receiverId === adminUid;


            return (

              currentUserInMessage &&

              adminInMessage

            );

          });


        showMessages(docs);

      },


      error => {

        console.error(
          "Message listener error:",
          error
        );


        chat.innerHTML = `

          <div class="empty">

            Could not load messages.

            <br><br>

            ${escapeHTML(
              error.message
            )}

          </div>

        `;

      }

    );

}


/* ==========================================
   SEND MESSAGE
========================================== */

async function sendMessage(){

  if(!currentUser){

    return;

  }


  if(!adminUid){

    alert(
      "Admin account is not available."
    );

    return;

  }


  const text =
    input.value.trim();


  if(!text){

    return;

  }


  try{

    sendBtn.disabled = true;


    await addDoc(

      collection(
        db,
        "messages"
      ),

      {

        senderId:
          currentUser.uid,

        receiverId:
          adminUid,

        text:
          text,

        participants:[

          currentUser.uid,

          adminUid

        ],

        createdAt:
          serverTimestamp()

      }

    );


    input.value = "";

    input.focus();

  }

  catch(error){

    console.error(
      "Send message error:",
      error
    );


    alert(
      "Message could not be sent.\n\n" +
      error.message
    );

  }

  finally{

    sendBtn.disabled = false;

  }

}


/* ==========================================
   SEND BUTTON
========================================== */

sendBtn.onclick =
  sendMessage;


/* ==========================================
   ENTER TO SEND
========================================== */

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* ==========================================
   MENU
========================================== */

menuBtn.onclick =
  event => {

    event.stopPropagation();

    popup.classList.toggle(
      "show"
    );

  };


/* ==========================================
   CLOSE MENU
========================================== */

document.addEventListener(
  "click",
  event => {

    if(

      !popup.contains(
        event.target
      )

      &&

      event.target !== menuBtn

    ){

      popup.classList.remove(
        "show"
      );

    }

  }
);


/* ==========================================
   WALLPAPER BUTTON
========================================== */

wallpaperBtn.onclick =
  () => {

    popup.classList.remove(
      "show"
    );

    wallpaperInput.click();

  };


/* ==========================================
   WALLPAPER SELECT
========================================== */

wallpaperInput.onchange =
  event => {

    const file =
      event.target.files[0];


    if(!file){

      return;

    }


    if(
      !file.type.startsWith("image/")
    ){

      alert(
        "Please select an image."
      );

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
      e => {

        const image =
          e.target.result;


        chat.style.backgroundImage =
          `url("${image}")`;


        try{

          localStorage.setItem(
            "virtualchat_wallpaper",
            image
          );

        }

        catch(error){

          console.error(
            "Wallpaper save error:",
            error
          );

        }

      };


    reader.readAsDataURL(file);

  };


/* ==========================================
   LOAD SAVED WALLPAPER
========================================== */

try{

  const savedWallpaper =
    localStorage.getItem(
      "virtualchat_wallpaper"
    );


  if(savedWallpaper){

    chat.style.backgroundImage =
      `url("${savedWallpaper}")`;

  }

}

catch(error){

  console.error(
    "Wallpaper load error:",
    error
  );

}


/* ==========================================
   LOGOUT
========================================== */

logoutBtn.onclick =
  async () => {

    try{

      if(stopMessages){

        stopMessages();

        stopMessages = null;

      }


      if(stopAdmin){

        stopAdmin();

        stopAdmin = null;

      }


      await signOut(auth);


      window.location.replace(
        "index.html"
      );

    }

    catch(error){

      console.error(
        "Logout error:",
        error
      );

    }

  };
/* ==========================================
   AUTH STATE
========================================== */

onAuthStateChanged(
  auth,
  user => {

    if(!user){

      window.location.replace(
        "index.html"
      );

      return;

    }


    currentUser =
      user;


    findAdmin();

  }
);


/* ==========================================
   CLEANUP
========================================== */

window.addEventListener(
  "beforeunload",
  () => {

    if(stopMessages){

      stopMessages();

    }


    if(stopAdmin){

      stopAdmin();

    }

  }
);


/* ==========================================
   MOBILE KEYBOARD FIX
========================================== */

if(window.visualViewport){

  const adjustForKeyboard =
    () => {

      const viewportHeight =
        window.visualViewport.height;


      const fullHeight =
        window.innerHeight;


      const keyboardOpen =
        fullHeight - viewportHeight > 120;


      if(keyboardOpen){

        document.body.style.height =
          viewportHeight + "px";

      }
      else{

        document.body.style.height =
          "100dvh";

      }


      requestAnimationFrame(() => {

        chat.scrollTop =
          chat.scrollHeight;

      });

    };


  window.visualViewport.addEventListener(
    "resize",
    adjustForKeyboard
  );


  window.visualViewport.addEventListener(
    "scroll",
    adjustForKeyboard
  );

}


/* ==========================================
   INPUT FOCUS
========================================== */

input.addEventListener(
  "focus",
  () => {

    setTimeout(() => {

      if(window.visualViewport){

        chat.scrollTop =
          chat.scrollHeight;

      }

    },150);

  }
);


</script>

</body>

</html>
