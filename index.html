<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Chat</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    width: 100%;
    max-width: 420px;
    padding: 20px;
}

.card {
    background: #fff;
    padding: 30px 22px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(56, 189, 248, 0.2);
}

.logo {
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    color: #38bdf8;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 25px;
}

input {
    width: 100%;
    padding: 14px;
    margin-bottom: 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #38bdf8;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #38bdf8;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #0ea5e9;
}

button:disabled {
    opacity: .6;
}

.switch {
    text-align: center;
    margin-top: 18px;
    color: #666;
}

.switch span {
    color: #0ea5e9;
    font-weight: bold;
    cursor: pointer;
}

.error {
    color: #d93025;
    text-align: center;
    margin-bottom: 12px;
    min-height: 20px;
    font-size: 14px;
}

.success {
    color: #188038;
    text-align: center;
    margin-bottom: 12px;
    min-height: 20px;
    font-size: 14px;
}

.loading {
    text-align: center;
    color: #777;
    margin-top: 10px;
}

#signupBox {
    display: none;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div class="card" id="loginBox">

    <div class="logo">Virtual Chat</div>

    <div class="subtitle">
        Login to continue
    </div>

    <div class="error" id="loginError"></div>

    <div class="success" id="loginSuccess"></div>

    <input
        type="text"
        id="loginUsername"
        placeholder="Username"
        autocomplete="username"
    >

    <input
        type="password"
        id="loginPassword"
        placeholder="Password"
        autocomplete="current-password"
    >

    <button id="loginBtn">
        Login
    </button>

    <div
        class="loading"
        id="loginLoading"
        style="display:none;"
    >
        Logging in...
    </div>

    <div class="switch">
        Don't have an account?
        <span id="showSignup">Sign Up</span>
    </div>

</div>


<!-- SIGN UP -->

<div class="card" id="signupBox">

    <div class="logo">Virtual Chat</div>

    <div class="subtitle">
        Create your account
    </div>

    <div class="error" id="signupError"></div>

    <div class="success" id="signupSuccess"></div>

    <input
        type="email"
        id="signupEmail"
        placeholder="Email"
        autocomplete="email"
    >

    <input
        type="text"
        id="signupUsername"
        placeholder="Username"
        autocomplete="username"
    >

    <input
        type="password"
        id="signupPassword"
        placeholder="Password"
        autocomplete="new-password"
    >

    <input
        type="password"
        id="signupConfirm"
        placeholder="Confirm Password"
        autocomplete="new-password"
    >

    <button id="signupBtn">
        Create Account
    </button>

    <div
        class="loading"
        id="signupLoading"
        style="display:none;"
    >
        Creating account...
    </div>

    <div class="switch">
        Already have an account?
        <span id="showLogin">Login</span>
    </div>

</div>

</div>


<script type="module">

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

import {
    getFirestore,
    collection,
    query,
    where,
    getDocs,
    doc,
    setDoc,
    getDoc,
    serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";


const firebaseConfig = {

    apiKey:
    "AIzaSyDCeUtuKciz8z3C0x__AEZeHv8X4Y9ClFU",

    authDomain:
    "virtualchat-1213.firebaseapp.com",

    projectId:
    "virtualchat-1213",

    storageBucket:
    "virtualchat-1213.firebasestorage.app",

    messagingSenderId:
    "10737514662",

    appId:
    "1:10737514662:web:7d418df0cf4f441d275c67",

    measurementId:
    "G-8WVST7HH7D"
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);


const loginBox =
    document.getElementById("loginBox");

const signupBox =
    document.getElementById("signupBox");

const loginError =
    document.getElementById("loginError");

const loginSuccess =
    document.getElementById("loginSuccess");

const signupError =
    document.getElementById("signupError");

const signupSuccess =
    document.getElementById("signupSuccess");

const loginBtn =
    document.getElementById("loginBtn");

const signupBtn =
    document.getElementById("signupBtn");

const loginLoading =
    document.getElementById("loginLoading");

const signupLoading =
    document.getElementById("signupLoading");


/* SHOW SIGN UP */

document
.getElementById("showSignup")
.onclick = () => {

    loginBox.style.display = "none";
    signupBox.style.display = "block";

    loginError.textContent = "";
    loginSuccess.textContent = "";
    signupError.textContent = "";
    signupSuccess.textContent = "";
};


/* SHOW LOGIN */

document
.getElementById("showLogin")
.onclick = () => {

    signupBox.style.display = "none";
    loginBox.style.display = "block";

    loginError.textContent = "";
    loginSuccess.textContent = "";
    signupError.textContent = "";
    signupSuccess.textContent = "";
};


/* SIGN UP */

signupBtn.onclick = async () => {

    signupError.textContent = "";
    signupSuccess.textContent = "";

    const email =
        document
        .getElementById("signupEmail")
        .value
        .trim();

    const username =
        document
        .getElementById("signupUsername")
        .value
        .trim();

    const password =
        document
        .getElementById("signupPassword")
        .value;

    const confirmPassword =
        document
        .getElementById("signupConfirm")
        .value;


    if (
        !email ||
        !username ||
        !password ||
        !confirmPassword
    ) {

        signupError.textContent =
            "Please fill all fields.";

        return;
    }


    /* VALID EMAIL */

    const emailPattern =
        /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {

        signupError.textContent =
            "Please enter a valid email address.";

        return;
    }


    /* USERNAME */

    if (username.length < 3) {

        signupError.textContent =
            "Username must be at least 3 characters.";

        return;
    }

    if (username.length > 30) {

        signupError.textContent =
            "Username must be 30 characters or less.";

        return;
    }

    if (!/^[a-zA-Z0-9_.]+$/.test(username)) {

        signupError.textContent =
            "Username can contain letters, numbers, _ and . only.";

        return;
    }


    /* PASSWORD */

    if (password.length < 6) {

        signupError.textContent =
            "Password must be at least 6 characters.";

        return;
    }

    /*
       No maximum password length is set here.
       Password can contain letters, numbers and symbols.
    */


    /* CONFIRM */

    if (password !== confirmPassword) {

        signupError.textContent =
            "Passwords do not match.";

        return;
    }


    signupBtn.disabled = true;
    signupLoading.style.display = "block";


    try {

        /* CHECK USERNAME */

        const usersCollection =
            collection(db, "users");

        const usernameQuery =
            query(
                usersCollection,
                where(
                    "username",
                    "==",
                    username
                )
            );

        const usernameResult =
            await getDocs(usernameQuery);


        if (!usernameResult.empty) {

            throw new Error(
                "This username is already taken."
            );
        }


        /* CREATE AUTH ACCOUNT */

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const uid =
            result.user.uid;


        /* CREATE USER PROFILE */

        await setDoc(
            doc(
                db,
                "users",
                uid
            ),
            {

                uid: uid,

                email: email,

                username: username,

                role: "user",

                createdAt:
                    serverTimestamp()
            }
        );


        /* LOGOUT */

        await signOut(auth);


        /* CLEAR FORM */

        document
        .getElementById("signupEmail")
        .value = "";

        document
        .getElementById("signupUsername")
        .value = "";

        document
        .getElementById("signupPassword")
        .value = "";

        document
        .getElementById("signupConfirm")
        .value = "";


        /* RETURN TO LOGIN */

        signupBox.style.display = "none";
        loginBox.style.display = "block";

        loginSuccess.textContent =
            "Account created successfully. Please login.";


    } catch (error) {

        console.error(error);

        if (
            error.code ===
            "auth/email-already-in-use"
        ) {

            signupError.textContent =
                "This email is already registered.";

        }

        else if (
            error.code ===
            "auth/invalid-email"
        ) {

            signupError.textContent =
                "Please enter a valid email address.";

        }

        else if (
            error.code ===
            "auth/weak-password"
        ) {

            signupError.textContent =
                "Password must be at least 6 characters.";

        }

        else {

            signupError.textContent =
                error.message
                .replace(
                    "Firebase: ",
                    ""
                );
        }
    }


    signupBtn.disabled = false;
    signupLoading.style.display = "none";
};


/* LOGIN */

loginBtn.onclick = async () => {

    loginError.textContent = "";
    loginSuccess.textContent = "";

    const username =
        document
        .getElementById("loginUsername")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;


    if (!username || !password) {

        loginError.textContent =
            "Please enter username and password.";

        return;
    }


    loginBtn.disabled = true;
    loginLoading.style.display = "block";


    try {

        /* FIND USER */

        const usersCollection =
            collection(db, "users");

        const usernameQuery =
            query(
                usersCollection,
                where(
                    "username",
                    "==",
                    username
                )
            );

        const result =
            await getDocs(usernameQuery);


        if (result.empty) {

            throw new Error(
                "Username not found."
            );
        }


        if (result.docs.length > 1) {

            throw new Error(
                "This username is duplicated."
            );
        }


        const userData =
            result.docs[0].data();


        if (!userData.email) {

            throw new Error(
                "This account has no email."
            );
        }


        /* FIREBASE AUTH LOGIN */

        await signInWithEmailAndPassword(
            auth,
            userData.email,
            password
        );


    } catch (error) {

        console.error(error);


        if (
            error.code ===
            "auth/invalid-credential"
        ) {

            loginError.textContent =
                "Wrong username or password.";

        }

        else if (
            error.code ===
            "auth/wrong-password"
        ) {

            loginError.textContent =
                "Wrong username or password.";

        }

        else {

            loginError.textContent =
                error.message
                .replace(
                    "Firebase: ",
                    ""
                );
        }
    }


    loginBtn.disabled = false;
    loginLoading.style.display = "none";
};


/* AUTH STATE */

onAuthStateChanged(
    auth,
    async (user) => {

        if (!user) {
            return;
        }


        try {

            const userRef =
                doc(
                    db,
                    "users",
                    user.uid
                );

            const userDoc =
                await getDoc(userRef);


            if (!userDoc.exists()) {

                await signOut(auth);

                return;
            }


            const data =
                userDoc.data();


            /* ADMIN */

            if (data.role === "admin") {

                window.location.href =
                    "admin.html";

                return;
            }


            /* USER */

            if (data.role === "user") {

                window.location.href =
                    "chat.html";

                return;
            }


            /* INVALID ROLE */

            await signOut(auth);

            loginError.textContent =
                "Account role is invalid.";

        } catch (error) {

            console.error(error);

            await signOut(auth);

            loginError.textContent =
                "Unable to load account.";
        }

    }
);

</script>

</body>
</html>
